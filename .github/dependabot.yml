version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - cargo
    commit-message:
      prefix: deps
      include: scope
    groups:
      rust-dependencies:
        patterns:
          - "*"
    ignore:
      # The manifest range starts at 0.32.1 so embedding hosts can link SQLx 0.8
      # (libsqlite3-sys 0.30). Widening it past 0.41 is a reviewed change.
      - dependency-name: rusqlite
        versions: [">= 0.42.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "actions/*"
          - "dtolnay/*"
          - "softprops/*"
