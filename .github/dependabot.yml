version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - cargo
    commit-message:
      prefix: deps
      include: scope
    groups:
      rust-dependencies:
        patterns:
          - "*"
    ignore:
      # Pinned so embedding hosts can link SQLx 0.8 (libsqlite3-sys 0.30);
      # later rusqlite lines need another libsqlite3-sys. Patch releases stay open.
      - dependency-name: rusqlite
        versions: [">= 0.33.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "actions/*"
          - "dtolnay/*"
          - "softprops/*"
