name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install pinned security tools
        run: make --silent security-tools
      - name: Run repository-owned security gates
        run: make --silent security-check
      - name: Verify tag, package version, and public ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin main:refs/remotes/origin/main

          package_version="$({
            cargo metadata --no-deps --locked --format-version 1
          } | python3 -c 'import json, sys; metadata = json.load(sys.stdin); root = metadata["workspace_root"] + "/Cargo.toml"; print(next(package["version"] for package in metadata["packages"] if package["manifest_path"] == root))')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match workspace package version ${expected_tag}." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "Tagged commit ${tag_commit} is not an ancestor of fetched origin/main." >&2
            exit 1
          fi
      - name: "Release gate: verify installer content provenance"
        shell: bash
        run: |
          set -euo pipefail
          installer_path=scripts/install-telltale
          working_blob="$(git hash-object "${installer_path}")"
          tagged_blob="$(git rev-parse "${GITHUB_SHA}:${installer_path}")"
          [[ "${working_blob}" == "${tagged_blob}" ]] || {
            echo "Installer content does not exactly match the tagged commit blob." >&2
            exit 1
          }
          mode="$(git ls-tree "${GITHUB_SHA}" -- "${installer_path}" | awk '{print $1}')"
          [[ "${mode}" == 100755 ]] || {
            echo "Installer must remain an executable file in the tagged commit." >&2
            exit 1
          }
          printf 'Installer content blob: %s\n' "${tagged_blob}"
      - name: Generate and repeat-verify release SBOM
        run: make --silent CARGO_LOCKED=--locked release-sbom
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/telltale-sbom.cdx.json
      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: telltale-sbom
          path: target/release/telltale-sbom.cdx.json
          if-no-files-found: error
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run full test suite
        run: cargo test --locked --quiet
      - name: Check public documentation boundary
        run: make --silent CARGO_LOCKED=--locked release-public-docs-check
      - name: Check canonical release identity
        run: make --silent CARGO_LOCKED=--locked release-canonical-identity-check
      - name: Check package and public-boundary manifest
        run: make --silent CARGO_LOCKED=--locked release-crate-manifest
      - name: Verify normalized packages and packaged CLI
        run: make --silent CARGO_LOCKED=--locked package-verify
      - name: Validate bundled rules and fixture-safe smoke
        run: make --silent CARGO_LOCKED=--locked release-fixture-smoke

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage and package release bundle (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/telltale-bundle"
          rm -rf "$bundle_dir"
          mkdir -p "$bundle_dir/config/examples"

           install -m 0755 "target/${{ matrix.target }}/release/telltale" "$bundle_dir/telltale"
          install -m 0644 LICENSE "$bundle_dir/LICENSE"
          install -m 0644 release/README.md "$bundle_dir/README.md"
          for example in \
            config/examples/telltale-outputs.yaml \
            config/examples/telltale-scan.service \
            config/examples/telltale-scan.timer \
            config/examples/telltale-scan-task.xml \
            config/examples/elastic-telltale-index-template.json \
            config/examples/elastic-telltale-role.json; do
            install -m 0644 "$example" "$bundle_dir/$example"
          done

          archive="telltale-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" \
            -C "$bundle_dir" \
            telltale LICENSE README.md \
            config/examples/telltale-outputs.yaml \
            config/examples/telltale-scan.service \
            config/examples/telltale-scan.timer \
            config/examples/telltale-scan-task.xml \
            config/examples/elastic-telltale-index-template.json \
            config/examples/elastic-telltale-role.json
          tar -tzf "$archive"
      - name: Native staged binary --version smoke (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          runner="${RUNNER_OS}:$(uname -m)"
          case "${{ matrix.target }}:${runner}" in
            x86_64-unknown-linux-gnu:Linux:x86_64|aarch64-unknown-linux-gnu:Linux:aarch64|aarch64-unknown-linux-gnu:Linux:arm64|x86_64-apple-darwin:macOS:x86_64|aarch64-apple-darwin:macOS:arm64|aarch64-apple-darwin:macOS:aarch64)
              "$RUNNER_TEMP/telltale-bundle/telltale" --version
              ;;
            *)
              echo "Skipping native --version smoke for cross-compiled target ${{ matrix.target }} on ${runner}."
              ;;
          esac
      - name: Stage and package release bundle (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDir = Join-Path $env:RUNNER_TEMP 'telltale-bundle'
          if (Test-Path -LiteralPath $bundleDir) {
            Remove-Item -LiteralPath $bundleDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Join-Path $bundleDir 'config/examples') -Force | Out-Null

          Copy-Item "target\${{ matrix.target }}\release\telltale.exe" (Join-Path $bundleDir 'telltale.exe')
          Copy-Item 'LICENSE' (Join-Path $bundleDir 'LICENSE')
          Copy-Item 'release\README.md' (Join-Path $bundleDir 'README.md')
          $examples = @(
            'telltale-outputs.yaml',
            'telltale-scan.service',
            'telltale-scan.timer',
            'telltale-scan-task.xml',
            'elastic-telltale-index-template.json',
            'elastic-telltale-role.json'
          )
          foreach ($example in $examples) {
            Copy-Item "config\examples\$example" (Join-Path $bundleDir "config/examples/$example")
          }

          $archive = "telltale-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $archivePath = Join-Path (Get-Location) $archive
          & .\scripts\release-windows-zip.ps1 -BundleDirectory $bundleDir -OutputArchive $archivePath
      - name: Mandatory Windows staged binary --version smoke
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($binary in @('telltale.exe')) {
            & (Join-Path $env:RUNNER_TEMP "telltale-bundle/$binary") --version
            if ($LASTEXITCODE -ne 0) {
              throw "$binary --version smoke failed"
            }
          }
      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: telltale-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: telltale-${{ matrix.target }}
          path: |
            telltale-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-downloads
          merge-multiple: true
      - name: Validate exact current-tag target archive set
        shell: bash
        run: |
          set -euo pipefail
          cd release-downloads
          shopt -s dotglob nullglob
          expected=(
            "telltale-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
            "telltale-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu.tar.gz"
            "telltale-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
            "telltale-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
            "telltale-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"
          )
          actual=(*)
          if [[ "${#actual[@]}" -eq "${#expected[@]}" ]]; then
            : # The five canonical target archives are present.
          elif [[ "${#actual[@]}" -eq "$(( ${#expected[@]} + 1 ))" && -f telltale-sbom.cdx.json && ! -L telltale-sbom.cdx.json ]]; then
            : # The five archives are accompanied by the fixed SBOM asset.
          else
            printf 'Expected exactly %s archives (or those archives plus the SBOM), found %s: %s\n' \
              "${#expected[@]}" "${#actual[@]}" "${actual[*]}" >&2
            exit 1
          fi
          for archive in "${actual[@]}"; do
            [[ "${archive}" == "telltale-sbom.cdx.json" ]] && continue
            [[ -f "${archive}" && ! -L "${archive}" ]] || {
              echo "Release artifact is not a regular file: ${archive}" >&2
              exit 1
            }
            case " ${expected[*]} " in
              *" ${archive} "*) ;;
              *)
                echo "Noncanonical release archive: ${archive}" >&2
                exit 1
                ;;
            esac
          done
          for archive in "${expected[@]}"; do
            [[ -f "${archive}" && ! -L "${archive}" ]] || {
              echo "Missing canonical release archive: ${archive}" >&2
              exit 1
            }
          done
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
      - name: Verify release SBOM matches tagged locked graph
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-sbom.py --check release-downloads/telltale-sbom.cdx.json
      - name: Generate checksums
        shell: bash
        run: |
          cd release-downloads
          shopt -s nullglob
          assets=(*.tar.gz *.zip telltale-sbom.cdx.json)
          test "${#assets[@]}" -eq 6
          printf '%s\0' "${assets[@]}" | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Require fixed release SBOM asset
        shell: bash
        run: |
          set -euo pipefail
          test -f release-downloads/telltale-sbom.cdx.json
          test ! -L release-downloads/telltale-sbom.cdx.json
      - name: Validate assembled release artifact manifests
        shell: bash
        run: REQUIRE_SBOM=1 make --silent RELEASE_ARTIFACT_DIR=release-downloads release-artifact-manifest
      - name: Fail closed if the tag already has a Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! response="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" 2>&1)"; then
            echo "Could not query GitHub Releases to prove that ${GITHUB_REF_NAME} has no existing Release." >&2
            exit 1
          fi
          match_state="$(printf '%s\n' "$response" | python3 -c '
          import json
          import sys

          try:
              pages = json.load(sys.stdin)
          except (TypeError, ValueError):
              raise SystemExit(1)

          if not isinstance(pages, list):
              raise SystemExit(1)
          match = False
          for page in pages:
              if not isinstance(page, list):
                  raise SystemExit(1)
              for release in page:
                  if (
                      not isinstance(release, dict)
                      or not isinstance(release.get("tag_name"), str)
                      or release["tag_name"] == ""
                  ):
                      raise SystemExit(1)
                  if release["tag_name"] == sys.argv[1]:
                      match = True
          print("match" if match else "absent")
           ' "$GITHUB_REF_NAME")" || {
            echo "Could not validate the GitHub Releases response." >&2
            exit 1
          }
          if [[ "$match_state" == "match" ]]; then
            echo "A GitHub Release already exists for ${GITHUB_REF_NAME}; published assets are immutable." >&2
            exit 1
          fi
          if [[ "$match_state" != "absent" ]]; then
           echo "Could not prove that ${GITHUB_REF_NAME} has no existing Release." >&2
           exit 1
           fi
      - name: Reserve GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          reservation_payload="$(python3 -c 'import json, sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1], "draft": True, "prerelease": sys.argv[2] == "true"}, separators=(",", ":")))' "${GITHUB_REF_NAME}" "${prerelease}")"
          if ! reservation_response="$(gh api --method POST --include --input - "repos/${GITHUB_REPOSITORY}/releases" <<< "${reservation_payload}" 2>&1)"; then
            echo "Could not reserve the GitHub Release for ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          http_status="$(printf '%s\n' "${reservation_response}" | awk '/^HTTP/{code=$2} END{print code}')"
          [[ "${http_status}" == "201" ]] || {
            echo "GitHub Release reservation did not return HTTP 201." >&2
            exit 1
          }
          reservation_body="$(printf '%s\n' "${reservation_response}" | awk 'BEGIN{body=0} body {print} /^[[:space:]]*$/ {body=1}')"
          printf '%s\n' "${reservation_body}" | python3 -c '
          import json
          import sys

          try:
              release = json.load(sys.stdin)
          except (TypeError, ValueError):
              raise SystemExit(1)
          if (
              not isinstance(release, dict)
              or type(release.get("id")) is not int
              or release.get("tag_name") != sys.argv[1]
              or release.get("draft") is not True
              or release.get("prerelease") is not (sys.argv[2] == "true")
          ):
              raise SystemExit(1)
           ' "${GITHUB_REF_NAME}" "${prerelease}" || {
            echo "GitHub Release reservation response was malformed or uncertain." >&2
            exit 1
          }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: false
          files: release-downloads/*
