name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage and package release bundle (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/adr-bundle"
          rm -rf "$bundle_dir"
          mkdir -p "$bundle_dir/config/examples"

          install -m 0755 "target/${{ matrix.target }}/release/adr" "$bundle_dir/adr"
          install -m 0644 LICENSE "$bundle_dir/LICENSE"
          install -m 0644 release/README.md "$bundle_dir/README.md"
          for example in \
            config/examples/telltale-outputs.yaml \
            config/examples/adr-scan.service \
            config/examples/adr-scan.timer \
            config/examples/adr-scan-task.xml; do
            install -m 0644 "$example" "$bundle_dir/$example"
          done

          archive="adr-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" \
            -C "$bundle_dir" \
            adr LICENSE README.md \
            config/examples/telltale-outputs.yaml \
            config/examples/adr-scan.service \
            config/examples/adr-scan.timer \
            config/examples/adr-scan-task.xml
          tar -tzf "$archive"
      - name: Stage and package release bundle (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDir = Join-Path $env:RUNNER_TEMP 'adr-bundle'
          if (Test-Path -LiteralPath $bundleDir) {
            Remove-Item -LiteralPath $bundleDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Join-Path $bundleDir 'config/examples') -Force | Out-Null

          Copy-Item "target\${{ matrix.target }}\release\adr.exe" (Join-Path $bundleDir 'adr.exe')
          Copy-Item 'LICENSE' (Join-Path $bundleDir 'LICENSE')
          Copy-Item 'release\README.md' (Join-Path $bundleDir 'README.md')
          $examples = @(
            'telltale-outputs.yaml',
            'adr-scan.service',
            'adr-scan.timer',
            'adr-scan-task.xml'
          )
          foreach ($example in $examples) {
            Copy-Item "config\examples\$example" (Join-Path $bundleDir "config/examples/$example")
          }

          $archive = "adr-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path (Join-Path $bundleDir '*') -DestinationPath $archive -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location) $archive))
          try {
            $zip.Entries | ForEach-Object FullName
          } finally {
            $zip.Dispose()
          }
      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: adr-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adr-${{ matrix.target }}
          path: adr-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release-downloads
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          test "${#archives[@]}" -gt 0
          printf '%s\0' "${archives[@]}" | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-downloads/*
