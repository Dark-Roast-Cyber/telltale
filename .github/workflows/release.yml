name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Verify tag, package version, and public ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin main:refs/remotes/origin/main

          package_version="$({
            cargo metadata --no-deps --locked --format-version 1
          } | python3 -c 'import json, sys; metadata = json.load(sys.stdin); root = metadata["workspace_root"] + "/Cargo.toml"; print(next(package["version"] for package in metadata["packages"] if package["manifest_path"] == root))')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match workspace package version ${expected_tag}." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "Tagged commit ${tag_commit} is not an ancestor of fetched origin/main." >&2
            exit 1
          fi
      - name: "Release gate: verify installer content provenance"
        shell: bash
        run: |
          set -euo pipefail
          installer_path=scripts/install-telltale
          working_blob="$(git hash-object "${installer_path}")"
          tagged_blob="$(git rev-parse "${GITHUB_SHA}:${installer_path}")"
          [[ "${working_blob}" == "${tagged_blob}" ]] || {
            echo "Installer content does not exactly match the tagged commit blob." >&2
            exit 1
          }
          mode="$(git ls-tree "${GITHUB_SHA}" -- "${installer_path}" | awk '{print $1}')"
          [[ "${mode}" == 100755 ]] || {
            echo "Installer must remain an executable file in the tagged commit." >&2
            exit 1
          }
          printf 'Installer content blob: %s\n' "${tagged_blob}"
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run full test suite
        run: cargo test --locked --quiet
      - name: Check public documentation boundary
        run: make --silent CARGO_LOCKED=--locked release-public-docs-check
      - name: Check canonical release identity
        run: make --silent CARGO_LOCKED=--locked release-canonical-identity-check
      - name: Check package and public-boundary manifest
        run: make --silent CARGO_LOCKED=--locked release-crate-manifest
      - name: Verify normalized packages and packaged CLI
        run: make --silent CARGO_LOCKED=--locked package-verify
      - name: Validate bundled rules and fixture-safe smoke
        run: make --silent CARGO_LOCKED=--locked release-fixture-smoke

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage and package release bundle (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/telltale-bundle"
          rm -rf "$bundle_dir"
          mkdir -p "$bundle_dir/config/examples"

           install -m 0755 "target/${{ matrix.target }}/release/telltale" "$bundle_dir/telltale"
          install -m 0644 LICENSE "$bundle_dir/LICENSE"
          install -m 0644 release/README.md "$bundle_dir/README.md"
          for example in \
            config/examples/telltale-outputs.yaml \
            config/examples/telltale-scan.service \
            config/examples/telltale-scan.timer \
            config/examples/telltale-scan-task.xml \
            config/examples/elastic-telltale-index-template.json \
            config/examples/elastic-telltale-role.json; do
            install -m 0644 "$example" "$bundle_dir/$example"
          done

          archive="telltale-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" \
            -C "$bundle_dir" \
            telltale LICENSE README.md \
            config/examples/telltale-outputs.yaml \
            config/examples/telltale-scan.service \
            config/examples/telltale-scan.timer \
            config/examples/telltale-scan-task.xml \
            config/examples/elastic-telltale-index-template.json \
            config/examples/elastic-telltale-role.json
          tar -tzf "$archive"
      - name: Native staged binary --version smoke (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          runner="${RUNNER_OS}:$(uname -m)"
          case "${{ matrix.target }}:${runner}" in
            x86_64-unknown-linux-gnu:Linux:x86_64|aarch64-unknown-linux-gnu:Linux:aarch64|aarch64-unknown-linux-gnu:Linux:arm64|x86_64-apple-darwin:macOS:x86_64|aarch64-apple-darwin:macOS:arm64|aarch64-apple-darwin:macOS:aarch64)
              "$RUNNER_TEMP/telltale-bundle/telltale" --version
              ;;
            *)
              echo "Skipping native --version smoke for cross-compiled target ${{ matrix.target }} on ${runner}."
              ;;
          esac
      - name: Stage and package release bundle (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDir = Join-Path $env:RUNNER_TEMP 'telltale-bundle'
          if (Test-Path -LiteralPath $bundleDir) {
            Remove-Item -LiteralPath $bundleDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Join-Path $bundleDir 'config/examples') -Force | Out-Null

          Copy-Item "target\${{ matrix.target }}\release\telltale.exe" (Join-Path $bundleDir 'telltale.exe')
          Copy-Item 'LICENSE' (Join-Path $bundleDir 'LICENSE')
          Copy-Item 'release\README.md' (Join-Path $bundleDir 'README.md')
          $examples = @(
            'telltale-outputs.yaml',
            'telltale-scan.service',
            'telltale-scan.timer',
            'telltale-scan-task.xml',
            'elastic-telltale-index-template.json',
            'elastic-telltale-role.json'
          )
          foreach ($example in $examples) {
            Copy-Item "config\examples\$example" (Join-Path $bundleDir "config/examples/$example")
          }

          $archive = "telltale-${{ github.ref_name }}-${{ matrix.target }}.zip"
          if (Test-Path -LiteralPath $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $members = @(
            @{ Source = (Join-Path $bundleDir 'telltale.exe'); Name = 'telltale.exe' },
            @{ Source = (Join-Path $bundleDir 'LICENSE'); Name = 'LICENSE' },
            @{ Source = (Join-Path $bundleDir 'README.md'); Name = 'README.md' },
            @{ Source = (Join-Path $bundleDir 'config/examples/telltale-outputs.yaml'); Name = 'config/examples/telltale-outputs.yaml' },
            @{ Source = (Join-Path $bundleDir 'config/examples/telltale-scan.service'); Name = 'config/examples/telltale-scan.service' },
            @{ Source = (Join-Path $bundleDir 'config/examples/telltale-scan.timer'); Name = 'config/examples/telltale-scan.timer' },
            @{ Source = (Join-Path $bundleDir 'config/examples/telltale-scan-task.xml'); Name = 'config/examples/telltale-scan-task.xml' },
            @{ Source = (Join-Path $bundleDir 'config/examples/elastic-telltale-index-template.json'); Name = 'config/examples/elastic-telltale-index-template.json' },
            @{ Source = (Join-Path $bundleDir 'config/examples/elastic-telltale-role.json'); Name = 'config/examples/elastic-telltale-role.json' }
          )
          $zip = [System.IO.Compression.ZipFile]::Open(
            (Join-Path (Get-Location) $archive),
            [System.IO.Compression.ZipArchiveMode]::Create
          )
          try {
            foreach ($member in $members) {
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $zip,
                $member.Source,
                $member.Name,
                [System.IO.Compression.CompressionLevel]::Optimal
              ) | Out-Null
            }
            $expected = @($members | ForEach-Object { $_.Name } | Sort-Object)
            $actual = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            $differences = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
            if ($differences -or $actual.Count -ne $expected.Count) {
              throw "Windows release ZIP members are not the exact canonical regular-member set: $($actual -join ', ')"
            }
          } finally {
            $zip.Dispose()
          }
      - name: Mandatory Windows staged binary --version smoke
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($binary in @('telltale.exe')) {
            & (Join-Path $env:RUNNER_TEMP "telltale-bundle/$binary") --version
            if ($LASTEXITCODE -ne 0) {
              throw "$binary --version smoke failed"
            }
          }
      - name: Attest release archive
        uses: actions/attest@v4.2.1
        with:
          subject-path: telltale-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: telltale-${{ matrix.target }}
          path: |
            telltale-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-downloads
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release-downloads
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          test "${#archives[@]}" -gt 0
          canonical_archives=(telltale-${GITHUB_REF_NAME}-*.tar.gz telltale-${GITHUB_REF_NAME}-*.zip)
          test "${#canonical_archives[@]}" -gt 0
          printf '%s\0' "${archives[@]}" | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Validate assembled release artifact manifests
        shell: bash
        run: make --silent RELEASE_ARTIFACT_DIR=release-downloads release-artifact-manifest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-downloads/*
