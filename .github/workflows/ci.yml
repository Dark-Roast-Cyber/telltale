name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  console:
    name: Telltale Console (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Display-free native console checks
        shell: bash
        run: sh scripts/telltale-console-check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: make --silent fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-
      - run: make --silent CARGO_LOCKED=--locked clippy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-
      # CI bootstrap exception: hosted runners need not have uv installed.
      - name: Install Event 3.0 validator dependency
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/telltale-schema-venv"
          "${RUNNER_TEMP}/telltale-schema-venv/bin/python" -m pip install 'jsonschema[format-nongpl]>=4.18,<5'
          "${RUNNER_TEMP}/telltale-schema-venv/bin/python" scripts/validate-event-jsonl --help >/dev/null
          printf '%s\n' "${RUNNER_TEMP}/telltale-schema-venv/bin" >> "${GITHUB_PATH}"
      - name: Run Linux tests and contract checks
        run: make --silent CARGO_LOCKED=--locked ci-linux-test
      - name: Test protected assignment opt-in
        run: cargo test --locked -p telltale-core --features protected-assignment --lib assignment::tests

  security:
    name: Security and supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-security-
      - name: Install pinned security tools
        run: make --silent security-tools
      - name: Run repository-owned security gates
        run: make --silent security-check

  package-verify:
    name: Package verification (POSIX sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Run the production package verifier through /bin/sh
        shell: sh
        run: ./scripts/package-verify
      - name: Run release fixture smoke through /bin/sh
        shell: sh
        run: make --silent CARGO_LOCKED=--locked release-fixture-smoke

  windows:
    name: Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Install Event 3.0 validator dependency
        shell: bash
        run: |
          python3 -m pip install 'jsonschema[format-nongpl]>=4.18,<5'
          python3 scripts/validate-event-jsonl --help >/dev/null
      - name: Validate Windows release ZIP helper
        shell: pwsh
        run: .\tests\release_windows_zip.ps1
      - name: Test Windows runtime verifier
        shell: pwsh
        run: .\tests\verify_windows_runtime.ps1
      - name: Compile protected assignment opt-in and fail-closed tests
        run: cargo check --locked -p telltale-core --features protected-assignment --tests --target x86_64-pc-windows-msvc
      - name: Test protected assignment unsupported-platform boundary
        run: cargo test --locked -p telltale-core --features protected-assignment --lib assignment::tests::unsupported_platforms_fail_before_state_creation -- --exact
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build official Windows release configuration
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Verify Windows release runtime imports
        shell: pwsh
        run: .\scripts\verify-windows-runtime.ps1 -BinaryPath .\target\x86_64-pc-windows-msvc\release\telltale.exe
      - name: Smoke-test Windows release binary
        shell: pwsh
        run: |
          .\target\x86_64-pc-windows-msvc\release\telltale.exe --version
          if ($LASTEXITCODE -ne 0) {
            throw 'telltale.exe --version smoke failed'
          }
      - name: Windows install and uninstall regression matrix
        shell: pwsh
        run: .\tests\windows_lifecycle.ps1 -BinaryPath .\target\x86_64-pc-windows-msvc\release\telltale.exe -TestScheduledTask -Python python3

  macos:
    name: macOS (aarch64-apple-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: aarch64-apple-darwin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Install Event 3.0 validator dependency
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/telltale-schema-venv"
          "${RUNNER_TEMP}/telltale-schema-venv/bin/python" -m pip install 'jsonschema[format-nongpl]>=4.18,<5'
          "${RUNNER_TEMP}/telltale-schema-venv/bin/python" scripts/validate-event-jsonl --help >/dev/null
          printf '%s\n' "${RUNNER_TEMP}/telltale-schema-venv/bin" >> "${GITHUB_PATH}"
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Test protected assignment unsupported-platform boundary
        run: cargo test --locked -p telltale-core --features protected-assignment --lib assignment::tests::unsupported_platforms_fail_before_state_creation -- --exact
      - name: Build staged native binaries
        run: cargo build --release --bin telltale
      - name: Smoke-test staged native binaries
        run: |
          ./target/release/telltale --version
          ./target/release/telltale rules validate
          ./target/release/telltale scan --once --dry-run \
            --emit-activity --emit-session-risk-summary \
            --root tests/fixtures/session_stores

  source-preflight:
    name: Prospective source preflight (exact SHA)
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect exact source and prospective identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git remote get-url origin)" = "https://github.com/Dark-Roast-Cyber/telltale"
          test "$(git remote get-url --push origin)" = "https://github.com/Dark-Roast-Cyber/telltale"
          echo "Reviewed source: $SOURCE_SHA"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          export TELLTALE_SOURCE_TAG="v$version"
          if git show-ref --verify --quiet "refs/tags/$TELLTALE_SOURCE_TAG"; then
            echo "prospective=false" >> "$GITHUB_OUTPUT"
            echo "Existing immutable tag $TELLTALE_SOURCE_TAG; prospective pre-tag checks are not applicable."
            exit 0
          fi
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request
          url = "https://api.github.com/repos/Dark-Roast-Cyber/telltale/releases/tags/" + os.environ["TELLTALE_SOURCE_TAG"]
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(request):
                  raise SystemExit("Prospective version already has a published Release")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY
          echo "prospective=true" >> "$GITHUB_OUTPUT"
          # A local runner branch provides the canonical Make release context.
          # No tag or remote branch is created or changed.
          git switch -c main "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        if: steps.identity.outputs.prospective == 'true'
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.identity.outputs.prospective == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-preflight-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-preflight-
      - name: Install Event 3.0 validator dependency
        if: steps.identity.outputs.prospective == 'true'
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/telltale-schema-venv"
          "${RUNNER_TEMP}/telltale-schema-venv/bin/python" -m pip install 'jsonschema[format-nongpl]>=4.18,<5'
          "${RUNNER_TEMP}/telltale-schema-venv/bin/python" scripts/validate-event-jsonl --help >/dev/null
          printf '%s\n' "${RUNNER_TEMP}/telltale-schema-venv/bin" >> "${GITHUB_PATH}"
      # Pull requests run only the release-specific gates; the fmt, clippy,
      # test and package-verify jobs already cover the rest. Pushes to main
      # keep the complete preflight on the exact source SHA.
      - name: Run prospective source release preflight
        if: steps.identity.outputs.prospective == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          preflight=release-preflight
          if [ "$EVENT_NAME" = "pull_request" ]; then
            preflight=release-preflight-ci
          fi
          make --silent CARGO_LOCKED=--locked PUBLIC_RELEASE_REMOTE=https://github.com/Dark-Roast-Cyber/telltale "$preflight"
      - name: Check independently locked embedding contracts
        if: steps.identity.outputs.prospective == 'true'
        run: make --silent embedding-contract-check
      - name: Check the supported Rust 1.88 embedding subset
        if: steps.identity.outputs.prospective == 'true'
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          make --silent embedding-rust188-check
      - name: Check a fresh standalone Git consumer at the exact source
        if: steps.identity.outputs.prospective == 'true'
        run: |
          consumer_root=$(mktemp -d "$RUNNER_TEMP/telltale-git-consumer.XXXXXX")
          export TELLTALE_GIT_CONSUMER_ROOT="$consumer_root"
          mkdir -p "$consumer_root/tests/fixtures/session_stores/opencode" "$consumer_root/scripts"
          cp -R tests/embedding-consumer "$consumer_root/tests/"
          cp tests/fixtures/session_stores/opencode/opencode.db "$consumer_root/tests/fixtures/session_stores/opencode/"
          cp scripts/embedding-contract-check "$consumer_root/scripts/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          root = Path(os.environ["TELLTALE_GIT_CONSUMER_ROOT"])
          manifest = root / "tests/embedding-consumer/Cargo.toml"
          version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          original = 'path = "../../crates/telltale", version = "=' + version + '"'
          replacement = 'git = "https://github.com/Dark-Roast-Cyber/telltale.git", rev = "' + os.environ["SOURCE_SHA"] + '", version = "=' + version + '"'
          text = manifest.read_text()
          assert text.count(original) == 1, "Unexpected external consumer dependency"
          manifest.write_text(text.replace(original, replacement))
          (manifest.parent / "Cargo.lock").unlink()
          PY
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/git-consumer"
          cargo generate-lockfile --manifest-path "$consumer_root/tests/embedding-consumer/Cargo.toml"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          lock = Path(os.environ["TELLTALE_GIT_CONSUMER_ROOT"]) / "tests/embedding-consumer/Cargo.lock"
          packages = tomllib.loads(lock.read_text())["package"]
          expected = {"telltale-core", "telltale-detect", "telltale-sources", "telltale-rules", "telltale-schema"}
          actual = [p for p in packages if p["name"] in expected]
          assert {p["name"] for p in actual} == expected and len(actual) == len(expected), "Incomplete or duplicate Git consumer dependency graph"
          source = "git+https://github.com/Dark-Roast-Cyber/telltale.git?rev=" + os.environ["SOURCE_SHA"] + "#" + os.environ["SOURCE_SHA"]
          version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          assert all(p.get("source") == source and p["version"] == version for p in actual), "Git consumer source/version identity drift"
          print("Standalone Git consumer resolved all five Telltale dependencies to " + os.environ["SOURCE_SHA"])
          PY
          sh "$consumer_root/scripts/embedding-contract-check"
          cargo clippy --locked --manifest-path "$consumer_root/tests/embedding-consumer/Cargo.toml" --all-targets --all-features -- -D warnings
          cargo fmt --manifest-path "$consumer_root/tests/embedding-consumer/Cargo.toml" --check
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
