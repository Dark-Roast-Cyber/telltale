name: Verify published native release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to verify
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Native release verification (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      TARGET: ${{ matrix.target }}
      RUNNER_LABEL: ${{ matrix.os }}

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select runner Python
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            printf 'python=python\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'python=python3\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Select checked-in release pin and verify immutable Release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: ${{ steps.runtime.outputs.python }}
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="${RUNNER_TEMP}/telltale-release-download"
          RELEASE_METADATA="${RUNNER_TEMP}/telltale-release.json"
          printf 'DOWNLOAD_DIR=%s\n' "${DOWNLOAD_DIR}" >> "${GITHUB_ENV}"
          printf 'RELEASE_METADATA=%s\n' "${RELEASE_METADATA}" >> "${GITHUB_ENV}"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "${GITHUB_SHA}"
          tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "${RELEASE_TAG}" =~ ${tag_re} ]]; then
            echo "release_tag is not a supported tag" >&2
            exit 1
          fi
          selection_output="$("${PYTHON}" scripts/release-native-verify \
            --select-pin --pins-dir scripts --release-tag "${RELEASE_TAG}" --target "${TARGET}")"
          selection_output="${selection_output//$'\r'/}"
          # macOS /bin/bash is 3.2, so parse the two selection lines with sed.
          PIN_FILE="$(printf '%s\n' "${selection_output}" | sed -n '1p')"
          ARCHIVE="$(printf '%s\n' "${selection_output}" | sed -n '2p')"
          test "$(printf '%s\n' "${selection_output}" | sed -n '$=')" = "2"
          case "${PIN_FILE}" in
            scripts/release-native-verify-*.json) ;;
            *) echo "selected pin path is not a checked-in pin" >&2; exit 1 ;;
          esac
          case "${PIN_FILE#scripts/release-native-verify-}" in
            */*|*..*) echo "selected pin path is not a checked-in pin" >&2; exit 1 ;;
          esac
          [[ "${ARCHIVE}" == "telltale-${RELEASE_TAG}-${TARGET}.tar.gz" || "${ARCHIVE}" == "telltale-${RELEASE_TAG}-${TARGET}.zip" ]]
          printf 'PIN_FILE=%s\nARCHIVE=%s\n' "${PIN_FILE}" "${ARCHIVE}" >> "${GITHUB_ENV}"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          printf 'verification_workflow_sha=%s\n' "${GITHUB_SHA}"
          printf 'candidate_source_sha=%s\n' "${tag_commit}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "${RELEASE_METADATA}"
          "${PYTHON}" - "${PIN_FILE}" "${RELEASE_TAG}" "${tag_commit}" "${RELEASE_METADATA}" "${TARGET}" "${ARCHIVE}" <<'PY'
          import json
          import sys

          from pathlib import Path

          pin_path, tag, tag_commit, metadata_path, target_name, archive_name = sys.argv[1:]
          path = Path(pin_path)
          if ("\\" in pin_path or path.parent != Path("scripts")
                  or not path.name.startswith("release-native-verify-")
                  or not path.name.endswith(".json") or ".." in path.name or path.is_symlink() or not path.is_file()
                  or path.resolve().parent != Path("scripts").resolve()):
              raise SystemExit("Selected pin is not a regular checked-in pin file")
          with open(pin_path, encoding="utf-8") as stream:
              pin = json.load(stream)
          if not isinstance(pin, dict):
              raise SystemExit("Selected pin must be an object")
          if tag != pin.get("release_tag") or tag_commit != pin.get("source_sha"):
              raise SystemExit("workflow input or source SHA is not the pinned candidate")
          if tag != "v" + str(pin.get("package_version", "")):
              raise SystemExit("release pin tag and package version do not agree")
          target = pin.get("targets", {}).get(target_name)
          suffix = ".zip" if target_name == "x86_64-pc-windows-msvc" else ".tar.gz"
          if (not isinstance(target, dict) or target.get("archive") != archive_name
                  or archive_name != f"telltale-{tag}-{target_name}{suffix}"):
              raise SystemExit("workflow target does not match the release pin")

          with open(metadata_path, encoding="utf-8") as stream:
              release = json.load(stream)
          if (
              release.get("id") != pin["release_id"]
              or release.get("tag_name") != pin["release_tag"]
              or release.get("prerelease") is not True
              or release.get("draft") is not False
          ):
              raise SystemExit("GitHub Release metadata is not the immutable prerelease")
          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("GitHub Release metadata has no usable assets list")
          matching = [asset for asset in assets if isinstance(asset, dict) and asset.get("name") == archive_name]
          if len(matching) != 1 or matching[0].get("digest") != "sha256:" + target["archive_sha256"]:
              raise SystemExit("GitHub Release asset digest does not match the release pin")
          if not any(isinstance(asset, dict) and asset.get("name") == "SHA256SUMS" for asset in assets):
              raise SystemExit("GitHub Release is missing SHA256SUMS")
          PY

      - name: Download only the published checksum and target archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${DOWNLOAD_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS \
            --pattern "${ARCHIVE}" \
            --dir "${DOWNLOAD_DIR}"
          test -f "${DOWNLOAD_DIR}/SHA256SUMS"
          test -f "${DOWNLOAD_DIR}/${ARCHIVE}"

      - name: Verify published archive attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "${DOWNLOAD_DIR}/${ARCHIVE}" --repo "${GITHUB_REPOSITORY}"

      # CI bootstrap exception: uv is not guaranteed on GitHub-hosted Windows/macOS images.
      - name: Install Event 3.0 JSON Schema validator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install --user jsonschema

      # CI bootstrap exception: uv is not guaranteed on GitHub-hosted Windows/macOS
      # images, and Homebrew Python on macOS rejects pip --user (PEP 668).
      - name: Install Event 3.0 JSON Schema validator (Unix)
        if: runner.os != 'Windows'
        id: unix-schema
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/telltale-schema-venv"
          "${RUNNER_TEMP}/telltale-schema-venv/bin/python" -m pip install jsonschema
          printf 'python=%s\n' "${RUNNER_TEMP}/telltale-schema-venv/bin/python" >> "${GITHUB_OUTPUT}"

      - name: Execute the downloaded Release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHON: ${{ steps.runtime.outputs.python }}
        run: |
          & $env:PYTHON scripts/release-native-verify `
            --repo-root "$env:GITHUB_WORKSPACE" `
            --pin "$env:PIN_FILE" `
            --target "$env:TARGET" `
            --release-metadata "$env:RELEASE_METADATA" `
            --download-dir "$env:DOWNLOAD_DIR" `
            --manifest-helper scripts/release-artifact-manifest `
            --event-validator scripts/validate-event-jsonl

      - name: Execute the downloaded Release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PYTHON: ${{ steps.unix-schema.outputs.python }}
        run: |
          "${PYTHON}" scripts/release-native-verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --pin "${PIN_FILE}" \
            --target "${TARGET}" \
            --release-metadata "${RELEASE_METADATA}" \
            --download-dir "${DOWNLOAD_DIR}" \
            --manifest-helper scripts/release-artifact-manifest \
            --event-validator scripts/validate-event-jsonl
