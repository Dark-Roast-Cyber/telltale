[package]
name = "telltale-discover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local AI tool inventory and descriptor-driven session-store discovery"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/telltale-discover"
readme = "README.md"
keywords = ["agents", "inventory", "discovery", "filesystem"]
categories = ["filesystem", "os"]
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/data/**", "/src/**", "/tests/**"]

[dependencies]
telltale-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation",
    "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security",
] }

[dev-dependencies]
tempfile = "3.14"
