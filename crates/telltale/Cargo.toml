[package]
name = "telltale-core"
version.workspace = true
edition.workspace = true
description = "Telltale embedding facade: discover, parse, and detect agentic coding activity in-process"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/telltale-core"
readme = "README.md"
keywords = ["security", "agents", "detection", "embedding"]
categories = ["development-tools"]
include = ["/Cargo.toml", "/README.md", "/LICENSE", "build.rs", "/examples/**", "/src/**"]

[features]
default = []
protected-assignment = ["dep:fs4", "dep:getrandom", "dep:hmac", "dep:rusqlite", "dep:libc"]

[dependencies]
fs4 = { version = "1.1", optional = true }
getrandom = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
sha2.workspace = true
telltale-schema.workspace = true
telltale-rules.workspace = true
telltale-sources.workspace = true
telltale-detect.workspace = true
time.workspace = true

[dev-dependencies]
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json.workspace = true
tempfile = "3.14"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
