[package]
name = "telltale-core"
version.workspace = true
edition.workspace = true
description = "Telltale embedding facade: discover, parse, and detect agentic coding activity in-process"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/telltale-core"
readme = "README.md"
keywords = ["security", "agents", "detection", "embedding"]
categories = ["development-tools"]
include = ["/Cargo.toml", "/README.md", "/LICENSE", "build.rs", "/examples/**", "/src/**"]

[dependencies]
fs4 = "0.13"
getrandom.workspace = true
hmac.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2.workspace = true
telltale-schema.workspace = true
telltale-rules.workspace = true
telltale-sources.workspace = true
telltale-detect.workspace = true

[dev-dependencies]
tempfile = "3.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
