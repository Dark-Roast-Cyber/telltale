# Deterministic marker rules for real-harness enforcement tests only. They let a
# test ask the model for a harmless command, or a harmless MCP tool argument,
# that Telltale scores as deny or ask, so harness enforcement is tested
# independently of model-side safety refusals of genuinely malicious-looking
# commands. Never deploy these.
title: E2E deny marker
id: 774f46db-ce54-44f4-8c05-684b869e5236
name: tth.e2e.deny_marker
taxonomy: telltale
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection:
        - tool.command|re: &pattern 'TTH_E2E_DENY_MARKER'
        - tool.arguments|re: *pattern
    condition: selection
level: critical
telltale:
    category: e2e_test
    score: 95
    explanation: 'Test-only marker that must be denied.'
    tags: [test-only]
