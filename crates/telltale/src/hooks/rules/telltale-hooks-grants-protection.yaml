title: Agent command resumes an existing harness session
id: c05d7f25-9075-4be1-bfae-a61ce27066eb
name: tth.tamper.harness_session_resume
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i|segment: '{{COMMAND_START}}{{SESSION_RESUME}}'
    filter_command:
        tool.command|re|i|segment: '{{VERSION_OR_HELP}}|{{TEXT_ONLY}}'
    condition: selection_command and not filter_command
falsepositives:
    - 'A user deliberately resuming another session of a harness from inside an agent session.'
    - 'Quoted text that names such a launch right after an opening parenthesis.'
level: high
telltale:
    category: approval_bypass
    score: 90
    explanation: 'A harness started at command position on an existing session: `claude --continue`, `claude -r <id> -p ...`, `claude --from-pr`, `claude --teleport`, `claude --session-id <id>`, `claude attach <id>`; `codex resume`, `codex fork`, `codex queue`, `codex exec resume --last ...`; `copilot --continue`, `copilot --resume <id>`, `copilot --session-id <id>`. A prompt the tool call hands that session is raised as the user''s prompt there, so it could allow a call the hook stopped. A fresh session (`claude -p "hello"`, `codex exec "task"`, `copilot -p "x"`), `--help` and `--version` alone, a launch whose option follows a standalone `--`, and a `git commit` or `grep` that quotes the words are not matched.'
    tags: [self-protection, hooks, defense-evasion, nested-agent, grants]
---
title: Agent command may resume an existing harness session
id: c53eb9ea-763b-478c-8efb-2c5ebff3968e
name: tth.tamper.harness_session_resume_failsafe
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i|recorded_exclusion: '{{COMMAND_START}}{{SESSION_RESUME}}'
    filter_command:
        tool.command|re|i|recorded_exclusion: '{{VERSION_OR_HELP}}|{{TEXT_ONLY}}'
    condition: selection_command and not filter_command
falsepositives:
    - 'A fresh harness session whose prompt names a resume option or begins with a resume word.'
level: medium
telltale:
    category: approval_bypass
    score: 60
    explanation: 'The fail-safe for harness_session_resume, which reads each command segment as written. This rule reads the same launch with the quoting taken away, so a launch whose words are split by quoting asks: `cl""aude -c`, `claude --res''''ume <id>`. A fresh session whose quoted prompt names a resume option (`claude -p "what does --resume do"`) or begins with a resume word (`codex exec "resume the migration"`) asks too. A grant never covers it.'
    tags: [self-protection, hooks, defense-evasion, nested-agent, grants]
