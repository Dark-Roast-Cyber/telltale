# A {{...}} name is pattern text several rules share, written once in engine.rs (RULE_FRAGMENTS)
# and expanded when the rules load.
#
# Telltale Hooks grant protection. Loaded only while grants are on
# (hooks.grants.enabled), as host rules beside telltale-hooks-self-protection.yaml,
# so a grant never covers them. A grant line is taken only from the event a harness
# raises for its user's prompt; these rules stop the tool calls that would raise such
# an event themselves: running the hook command with a payload of the call's own
# making, and starting a harness on an existing session, which would take a prompt the
# call supplies into that session. Command position follows the shared document
# (COMMAND_START); crates/telltale/tests/hooks/self_protection_corpus.rs holds the
# cases and the benign controls.
title: Agent command runs the Telltale Hooks hook command
id: 13c26fd3-0648-4768-9f7e-6536a3eee219
name: tth.tamper.hook_entry_run
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i|recorded_exclusion: '{{COMMAND_START}}(?:["''](?:[^"''\n]*[\\/])?|[^\s;&|"'']*[\\/])?(?:telltale(?:\.exe|\.cmd)?["'']?(?:[ \t]|\\\n)+["'']?hooks|telltale-hooks(?:\.exe|\.cmd)?)["'']?(?:[ \t]|\\\n)+["'']?[A-Za-z0-9_.-]+["'']?(?:[ \t]|\\\n)+["'']?hook["'']?(?:[\s;&|)`<>]|$)'
    filter_command:
        tool.command|re|i|recorded_exclusion: '{{VERSION_OR_HELP}}|{{TEXT_ONLY}}'
    condition: selection_command and not filter_command
falsepositives:
    - 'An operator feeding the hook a saved payload by hand to see what it answers.'
level: high
telltale:
    category: approval_bypass
    score: 90
    explanation: '`telltale hooks <harness> hook` (or the old standalone `telltale-hooks <harness> hook`) at command position, with any path, quoting, flags or input: `printf ''{...}'' | telltale hooks claude-code hook`, `/usr/local/bin/telltale hooks codex-cli hook --config-dir /etc/x <<< ''{...}''`. Only a harness runs the hook command; a tool call that runs it can hand the hook an event of its own making, such as a user prompt that allows a stopped call. `telltale hooks check`, `telltale hooks <harness> settings`, `--help` and `--version` alone, and a `git commit` that quotes the command are not matched.'
    tags: [self-protection, hooks, defense-evasion, grants]
