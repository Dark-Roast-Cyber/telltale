    category: approval_bypass
    severity: high
    score: 90
    detection:
      selection:
        command: '(?s)(?:^|[;&|({`\n]|\s-(?:exec|ok)(?:dir)?\s)\s*(?:\\?(?:\S*[\\/])?(?:sudo|doas|env|command|builtin|exec|nohup|time|nice|timeout|xargs|busybox|eval|iex|if|then|do|else|!|[^\s=]+=\S*|-\S+(?:\s+\S+)?|/[A-Za-z]|[0-9]\S*|(?:ba|z|da|k)?sh|cmd(?:\.exe)?|(?:powershell|pwsh)(?:\.exe)?)\s+["'']?)*\\?(?:\S*[\\/])?(?:(?:(?:rm|mv|cp|dd|install|truncate|shred|unlink|chmod|chown|chattr|ln|tee|eval)\s|sed\s+(?:[^;&|]*\s)?-(?:[a-z]*i|-in-place))(?:[^;&|\n]|\\\n|''[^'']*''|"[^"]*")*|(?:python[0-9.]*\s+-[^mvVh\s-]|(?:perl|node|ruby|php)\s+-[^vVh\s-]).*)(?:(?:\.copilot|COPILOT_HOME)[}%"'']*(?:[\\/]+\.)*[\\/]+(?:(?:hooks|agents)(?:[\\/\s"''`;&|)]|$)|settings(?:\.local)?\.json|(?:[^\s;&|"'']*[\\/])?hooks\.json)|\.github(?:[\\/]+\.)*[\\/]+(?:hooks(?:[\\/\s"''`;&|)]|$)|copilot(?:[\\/]+\.)*[\\/]+settings(?:\.local)?\.json)|(?:github-copilot|GitHub[\\/]+Copilot)[\\/]+policy\.d(?:[\\/\s"''`;&|)]|$)|(?:\.plugin|\.claude-plugin|\.github(?:[\\/]+\.)*[\\/]+plugin)[\\/]+(?:[^\s;&|"'']*[\\/])?hooks\.json)'
