version: 1
description: >-
  Telltale Hooks self-protection for GitHub Copilot CLI (verified contract: 1.0.105,
  docs/harnesses/copilot-cli.md): $COPILOT_HOME/hooks and agents, inline hooks in
  $COPILOT_HOME/settings.json, repository .github/hooks and
  .github/copilot/settings{,.local}.json, the machine policy directory, plugin
  hooks.json. Repository .github/agents asks rather than denies. Same shapes and command-position discipline as
  rules/telltale-hooks-self-protection.yaml. A resolved custom COPILOT_HOME gets a
  generated rule at hook time (engine.rs).
defaults:
  case_insensitive: true
  enabled: true
rules:
  # Command position: a writing program counts only at the start of a
  # command: start of text, after `;`, `&`, `|`, `(`, `{`, a backtick or a newline, or
  # after find's -exec, optionally behind sudo, doas, env, command, exec, nohup, time,
  # nice, timeout, xargs, busybox, eval, iex, if, then, do, else, !, an assignment,
  # options, sh -c, cmd /c or powershell -c. A word after any other whitespace is an
  # argument, so `grep -i rename` and `# copy review` are not writers. A wrapper or
  # spelling these rules do not list falls to a *_reference or *_failsafe rule, which
  # ask: a protected path with a writer word anywhere in the command, or a harness word
  # with what turns its hooks off. `sed` counts
  # only with -i or --in-place. A writer is qualified by a path or backslash if any
  # (`/bin/rm`, `\rm`), and its target must be in its own command, unless it is an
  # interpreter one-liner, whose program can hold `;`. An interpreter counts only with
  # a flag other than -m, -v or -h. The exclusion lets commands that cannot write through,
  # whatever they name: plain reads, read pipelines, git reads, `sed -n`, a
  # script file's arguments, `gh pr` and `git commit` text, beside commands that name
  # no path and one `cd`. It holds only for a command it can read plainly: a list of
  # plain words and complete quoted strings. Anything else asks.
  - id: tth.tamper.copilot_hook_write
    title: Agent writes a GitHub Copilot CLI hook file
    category: approval_bypass
    severity: high
    score: 90
    targets: [written_path]
    regex: '(?m)(?:^|[\\/$%{:])(?:(?:\.copilot|COPILOT_HOME)[}%"'']*(?:[\\/]+\.)*[\\/]+(?:(?:hooks|agents)(?:[\\/\s"''`;&|)]|$)|settings(?:\.local)?\.json|(?:[^\s;&|"'']*[\\/])?hooks\.json)|\.github(?:[\\/]+\.)*[\\/]+(?:hooks(?:[\\/\s"''`;&|)]|$)|copilot(?:[\\/]+\.)*[\\/]+settings(?:\.local)?\.json)|(?:github-copilot|GitHub[\\/]+Copilot)[\\/]+policy\.d(?:[\\/\s"''`;&|)]|$)|(?:\.plugin|\.claude-plugin|\.github(?:[\\/]+\.)*[\\/]+plugin)[\\/]+(?:[^\s;&|"'']*[\\/])?hooks\.json)|^(?:\./)?plugins?[\\/]+(?:[^\s;&|"'']*[\\/])?hooks\.json'
    tags: [self-protection, hooks, defense-evasion]
    explanation: >-
      A tool call writes `$COPILOT_HOME/hooks/`, `~/.copilot/hooks/` (Windows `%USERPROFILE%\.copilot\hooks\`), `settings.json` or `agents/` there, `.github/hooks/`, `.github/copilot/settings{,.local}.json`, `/etc/github-copilot/policy.d/` (`C:\ProgramData\GitHub\Copilot\policy.d\`) or a plugin `hooks.json` (hooks.json or hooks/hooks.json in a plugin root). A relative `plugins/` must start the path: `src/plugins/foo/hooks.json` is a source file. Agent definitions can carry hooks; `settings.json` can set `disableAllHooks`. Every line of a multi-target patch counts.
    falsepositives:
      - A user asks the agent to author repository hooks.
  - id: tth.tamper.copilot_hook_modify
