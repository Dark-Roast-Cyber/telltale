      condition: selection
    tags: [self-protection, hooks, defense-evasion]
    explanation: >-
      A shell command names a Copilot hook file or directory after a writing program at command position, in the same command unless it is an interpreter one-liner.
    falsepositives:
      - A user asks the agent to author repository hooks.
