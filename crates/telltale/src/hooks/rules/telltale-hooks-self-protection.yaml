detection:
    selection_command:
        tool.command|re|i|recorded_exclusion: '{{COMMAND_START}}(?:npx|pnpx|bunx|(?:pnpm|yarn)\s+dlx|npm\s+(?:exec|x))\s{{SEGMENT}}{{HARNESS_PACKAGES}}\b'
    filter_command:
        tool.command|re|i|recorded_exclusion: '{{VERSION_OR_HELP}}'
    condition: selection_command and not filter_command
falsepositives:
    - 'A user deliberately trying another harness version.'
level: high
telltale:
