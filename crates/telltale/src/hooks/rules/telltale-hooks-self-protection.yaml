title: Agent launches a harness with Telltale Hooks pointed at its own configuration or state
id: 881eacb1-7eb5-4de5-b1d9-7bc4a67948cf
name: tth.tamper.hook_env_override
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i|recorded_exclusion: '(?s)(?:(?:\bTELLTALE_(?:HOOKS_(?:STATE_DIR|TELEMETRY)|COMMUNITY_RULES|PROCESS_CHAIN_DETECTIONS)=\S*[^;&|]*|\bexport\s+TELLTALE_(?:HOOKS_(?:STATE_DIR|TELEMETRY)|COMMUNITY_RULES|PROCESS_CHAIN_DETECTIONS)=.*)(?:^|[\s;&|(`]){{HARNESS_LAUNCHER_NAMES}}\b|\b{{CONFIG_LOCATION_VARS}}=(?:"[^"]*"|''[^'']*''|\S*)\s+(?:[^\s=]+=\S*\s+|{{LAUNCH_WRAPPERS}}\s+)*{{HARNESS_LAUNCHER}})'
    filter_command:
        tool.command|re|i|recorded_exclusion: '{{TEXT_ONLY}}'
    condition: selection_command and not filter_command
falsepositives:
    - 'Test harnesses such as scripts/hooks/harness/claude-code-e2e.sh, which run under a disposable state directory on purpose.'
level: high
telltale:
    category: approval_bypass
    score: 90
    explanation: 'A harness started in a command that also sets `TELLTALE_HOOKS_STATE_DIR` or `TELLTALE_HOOKS_TELEMETRY`, or `TELLTALE_COMMUNITY_RULES` or `TELLTALE_PROCESS_CHAIN_DETECTIONS` (inline in the same command segment, or `export ...` followed by a launch anywhere later in the command), or `XDG_CONFIG_HOME`, `XDG_STATE_HOME` or `HOME` inline before the launch, would run its hooks against an agent-chosen config root (whose settings can say `hooks.mode: observe`), with fewer rules, or with a fresh session journal, escaping the parent''s policy and history. An export without a launch in the same command is inert: hook processes inherit the harness''s environment, not the agent''s shell.'
    tags: [self-protection, hooks, defense-evasion, nested-agent]
