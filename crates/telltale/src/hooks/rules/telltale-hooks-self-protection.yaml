title: Agent command names a harness and what turns its hooks off
id: e26d7db2-2713-455a-82d3-9099ce6da67e
name: tth.tamper.harness_launch_failsafe
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i|recorded_exclusion: '(?s)(?:(?:^|[^.0-9A-Z_a-z])(?:claude\b.*--bare\b|opencode\b.*--pure\b|{{HARNESS_LAUNCHER_NAMES}}\b.*\b(?:XDG_[A-Z]+_HOME|HOME|USERPROFILE|(?:LOCAL)?APPDATA|CO(?:DEX|PILOT)_HOME|CLAUDE_CODE_SIMPLE|TELLTALE_[A-Z_]+)\s*=|codex\b.*(?:--ignore-(?:user-config|rules)\b|--dangerously-bypass-hook-trust\b|--disable[\s=]+["'']?(?:codex_)?hooks\b|features(?:\.(?:codex_)?hooks\s*=\s*["'']?false|\s*=\s*\{[^}]*hooks\s*=\s*false|\s+disable\s+["'']?(?:codex_)?hooks\b)))|--bare\b.*[^.0-9A-Z_a-z]claude\b|--pure\b.*[^.0-9A-Z_a-z]opencode\b|\b(?:XDG_[A-Z]+_HOME|HOME|USERPROFILE|(?:LOCAL)?APPDATA|CO(?:DEX|PILOT)_HOME|CLAUDE_CODE_SIMPLE|TELLTALE_[A-Z_]+)\s*=.*[^.0-9A-Z_a-z]{{HARNESS_LAUNCHER_NAMES}}\b|(?:--ignore-(?:user-config|rules)\b|--dangerously-bypass-hook-trust\b|--disable[\s=]+["'']?(?:codex_)?hooks\b|features(?:\.(?:codex_)?hooks\s*=\s*["'']?false|\s*=\s*\{[^}]*hooks\s*=\s*false|\s+disable\s+["'']?(?:codex_)?hooks\b)).*[^.0-9A-Z_a-z]codex\b)'
    filter_command:
        tool.command|re|i|recorded_exclusion: '^\s*(?:cd +[!*-:=?-\[\]-_a-{}~]+ *(?:&&|;)\s*)*{{READERS}}$|{{VERSION_OR_HELP}}|^\s*git +(?:clone|init)(?: +[-A-Za-z0-9_./:=@~+]+)* *$'
    condition: selection_command and not filter_command
falsepositives:
    - 'A command that sets `HOME` or `CODEX_HOME` for a tool and mentions a harness elsewhere.'
level: medium
telltale:
    category: approval_bypass
    score: 60
    explanation: 'The fail-safe for launches the deny rules do not recognize: a harness word and its own hook-disabling flag, or any harness word and an override of a harness home or the hook''s environment, anywhere in the command and in either order, whatever wraps it and whatever follows it: `setsid claude --bare`, `setsid codex --ignore-rules`, `claude --bare -p hi -- --help`, `CODEX_HOME=/tmp/x setsid codex`. One rule for all of them, so two launches on one line ask. A read or text that quotes a launch, and a harness''s own `--help` or `--version`, stay silent.'
    tags: [self-protection, hooks, defense-evasion, nested-agent]
