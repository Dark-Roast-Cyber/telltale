title: Agent launches a harness without the environment that locates Telltale Hooks configuration
id: f08b3fa1-377c-4d9b-98a9-60d2c5433b7b
name: tth.tamper.hook_env_unset
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i|recorded_exclusion: '(?s){{COMMAND_START}}(?:env(?:\s+(?:-[a-z]*[cus]\s*\S+|--(?:chdir|split-string|unset)(?:=|\s+)\S+|-\S*|[^\s=]+=\S*))*\s+(?:-[a-z]*u\s*["'']?{{CONFIG_LOCATION_VARS}}|--unset(?:=|\s+)["'']?{{CONFIG_LOCATION_VARS}}|-[a-z]*i|--ignore-environment|-)["'']?(?:\s+(?:-[a-z]*[cus]\s*\S+|--(?:chdir|split-string|unset)(?:=|\s+)\S+|-\S*|[^\s=]+=\S*))*|exec(?:\s+-[a-z]*a\s*\S+|\s+-[a-z]+)*\s+-[a-z]*c[a-z]*)\s+(?:{{LAUNCH_WRAPPERS}}\s+)*{{HARNESS_LAUNCHER}}'
    filter_command:
        tool.command|re|i|recorded_exclusion: '{{TEXT_ONLY}}'
    condition: selection_command and not filter_command
falsepositives:
    - 'Test harnesses that run a harness in an emptied environment on purpose.'
level: high
telltale:
    category: approval_bypass
    score: 90
    explanation: 'The removal form of hook_env_override: a harness started with `HOME`, `XDG_CONFIG_HOME`, `XDG_STATE_HOME`, `USERPROFILE`, `APPDATA` or `LOCALAPPDATA` removed (`env -u HOME claude`, `env --unset=XDG_CONFIG_HOME codex`) or in an emptied environment (`env -i claude`, `env - codex`, `exec -c copilot`). A hook command generated before the user config root was pinned then reads another root, or none, and a user-level `hooks.mode: enforce` is lost. Removing an unrelated variable, or one of these without a launch, does not match.'
    tags: [self-protection, hooks, defense-evasion, nested-agent]
