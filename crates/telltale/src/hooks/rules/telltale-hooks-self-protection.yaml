title: Agent writes Telltale configuration for another home
id: b5908903-088a-41dd-8298-1cda4ba3d263
name: tth.tamper.hook_config_stage
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i: '(?s)(?:{{COMMAND_START}}{{WRITERS}}{{SEGMENT}}|{{REDIRECT_TO}}{{REDIRECT_SKIP}})\btelltale[\\/]+(?:settings|policies|overrides|rule-packages|(?:organization-|ui-)?rules)\.d(?:[\\/\s"''`;&|)]|$)'
    filter_command:
        tool.command|re|i: '{{TEXT_ONLY}}'
    selection_written_path:
        tool.written_path|re|i: '(?m)(?:^|[\\/])telltale[\\/]+(?:settings|policies|overrides|rule-packages|(?:organization-|ui-)?rules)\.d[\\/]'
    condition: (selection_command and not filter_command) or selection_written_path
falsepositives:
    - 'A test fixture kept in a directory named telltale.'
level: high
telltale:
    category: approval_bypass
    score: 90
    explanation: 'A file in `<dir>/telltale/settings.d`, or another folder the hooks read (`rules.d`, `policies.d`, `overrides.d`, `rule-packages.d`), outside the real config roots (which own_state_modify and hook_settings_write cover) does nothing until `XDG_CONFIG_HOME=<dir>` or `HOME` points a harness at it. Such a folder can set `hooks.mode: observe` or turn rules off, which then allows what these rules deny. The launch rules above are what stop it being used.'
    tags: [self-protection, hooks, defense-evasion, nested-agent]
