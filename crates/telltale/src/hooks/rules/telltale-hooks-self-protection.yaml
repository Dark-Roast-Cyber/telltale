      condition: selection
    tags: [self-protection, hooks, defense-evasion]
    explanation: >-
      The Windows counterpart of hook_settings_modify: cmd.exe (`del`, `copy`, `move`, `ren`) and PowerShell (`Remove-Item`, `Set-Content`, `Out-File`, `Move-Item`, aliases `ri`, `sc`, ...) at command position.
    falsepositives:
      - Operators reconfiguring hooks by hand on Windows.
