version: 1
description: >-
  Telltale Hooks self-protection for Claude Code, Cursor and Telltale Hooks itself,
  plus the launch forms of every harness. Detects an agent tool call that would
  disable or alter the hooks monitoring it. Host-specific knowledge of hook
  installation paths, loaded additively into Telltale's Rule v1 pipeline. Generic
  agent-harness tampering belongs upstream. Paths of other harnesses are in
  copilot-cli-self-protection.yaml and codex-cli-self-protection.yaml. The runtime
  adds generated rules for this installation's own paths, custom harness homes and
  binary (engine.rs). Patterns stay under Telltale's 1,024-byte cap, which is why
  each direction of a writer and a path is its own rule
  (crates/telltale/tests/hooks/self_protection_corpus.rs is the regression suite,
  including the benign controls).
defaults:
  case_insensitive: true
  enabled: true
rules:
  # Command position: a writing program counts only at the start of a
  # command: start of text, after `;`, `&`, `|`, `(`, `{`, a backtick or a newline, or
  # after find's -exec, optionally behind sudo, doas, env, command, exec, nohup, time,
  # nice, timeout, xargs, busybox, eval, iex, if, then, do, else, !, an assignment,
  # options, sh -c, cmd /c or powershell -c. A word after any other whitespace is an
  # argument, so `grep -i rename` and `# copy review` are not writers. A wrapper or
  # spelling these rules do not list falls to a *_reference or *_failsafe rule, which
  # ask: a protected path with a writer word anywhere in the command, or a harness word
  # with what turns its hooks off. `sed` counts
  # only with -i or --in-place. A writer is qualified by a path or backslash if any
  # (`/bin/rm`, `\rm`), and its target must be in its own command, unless it is an
  # interpreter one-liner, whose program can hold `;`. An interpreter counts only with
  # a flag other than -m, -v or -h. The exclusion lets commands that cannot write through,
  # whatever they name: plain reads, read pipelines, git reads, `sed -n`, a
  # script file's arguments, `gh pr` and `git commit` text, beside commands that name
  # no path and one `cd`. It holds only for a command it can read plainly: a list of
  # plain words and complete quoted strings. Anything else asks.
  - id: tth.tamper.hook_settings_write
    title: Agent writes harness hook settings or Telltale Hooks state
    category: approval_bypass
    severity: high
    score: 90
    targets: [written_path]
    regex: '(?m)(?:^|[\\/])(?:\.claude(?:[\\/]+\.)*[\\/]+settings(?:\.local)?\.json|managed-settings(?:\.json|\.d(?:[\\/\s"''`;&|)]|$))|50-telltale-hooks\.json|\.cursor(?:[\\/]+\.)*[\\/]+hooks\.json|(?:Application\\?\s+Support|PROGRA(?:m\\?\s*Files|~[0-9])[%}]?)[\\/]+ClaudeCode(?:[\\/\s"''`;&|)]|$)|(?:\.local(?:[\\/]+\.)*[\\/]+state|\.config|%(?:LOCAL)?APPDATA%|\$env:(?:LOCAL)?APPDATA|\$\{?XDG_(?:STATE|CONFIG)_HOME\}?|AppData[\\/]+(?:Local|Roaming)|Application\\?\s+Support)(?:[\\/]+\.)*[\\/]+telltale-hooks)|[\\/]etc[\\/]+claude-code(?:[\\/\s"''`;&|)]|$)|[\\/]etc[\\/]+telltale-hooks'
    tags: [self-protection, hooks, defense-evasion]
    explanation: >-
      A tool call writes a file that configures agent hooks or holds Telltale Hooks configuration or state, including Claude Code managed settings in /etc/claude-code, /Library/Application Support/ClaudeCode and C:\Program Files\ClaudeCode (managed-settings.json and managed-settings.d). Path forms with repeated separators, `/./` segments, backslashes, XDG and APPDATA environment variables are covered, and every line of a multi-target patch counts.
    falsepositives:
      - A user explicitly asks the agent to edit its own harness settings.
  - id: tth.tamper.hook_settings_modify
    title: Agent command can modify harness hook settings
    category: approval_bypass
    severity: high
    score: 90
    detection:
      selection:
        command: '(?s)(?:^|[;&|({`\n]|\s-(?:exec|ok)(?:dir)?\s)\s*(?:\\?(?:\S*[\\/])?(?:sudo|doas|env|command|builtin|exec|nohup|time|nice|timeout|xargs|busybox|eval|iex|if|then|do|else|!|[^\s=]+=\S*|-\S+(?:\s+\S+)?|/[A-Za-z]|[0-9]\S*|(?:ba|z|da|k)?sh|cmd(?:\.exe)?|(?:powershell|pwsh)(?:\.exe)?)\s+["'']?)*\\?(?:\S*[\\/])?(?:(?:(?:rm|mv|cp|dd|install|truncate|shred|unlink|chmod|chown|chattr|ln|tee|eval)\s|sed\s+(?:[^;&|]*\s)?-(?:[a-z]*i|-in-place))(?:[^;&|\n]|\\\n|''[^'']*''|"[^"]*")*|(?:python[0-9.]*\s+-[^mvVh\s-]|(?:perl|node|ruby|php)\s+-[^vVh\s-]).*)(?:\.claude(?:[\\/]+\.)*[\\/]+settings(?:\.local)?\.json|managed-settings(?:\.json|\.d(?:[\\/\s"''`;&|)]|$))|50-telltale-hooks\.json|\.cursor(?:[\\/]+\.)*[\\/]+hooks\.json|(?:Application\\?\s+Support|PROGRA(?:m\\?\s*Files|~[0-9])[%}]?)[\\/]+ClaudeCode(?:[\\/\s"''`;&|)]|$)|[\\/]etc[\\/]+claude-code(?:[\\/\s"''`;&|)]|$))'
      exclude:
        command: '^\s*(?:(?:[-A-Za-z0-9_][-.A-Za-z0-9_]* *)+[;&]+\s*)*(?:(?:git +add|test|\[) +[ !*-:=?-\[\]-_a-{}~]*[;&]+\s*)*(?:(?:git +commit|gh +(?:pr|issue))(?: +(?:"(?:(?:\\?[^-"\\;&|<>`$()\n\r]|\\["\\])-*)*"|[!*-:=?-\[\]-_a-{}~]*))*|(?:(?:cd|(?:python3?|node) +[A-Z_a-z0-9./~][!*-:=?-\[\]-_a-{}~]*)(?: +(?:"(?:(?:\\?[^-"`$\\“-„]|\$[A-Z_a-z])-*)*"|(?:[!*-:=?-\[\]-_a-{}~]|\$[A-Z_a-z])*))*(?:[;&|]+\s*|$))*(?:(?:(?:cat|head|tail|grep|jq|cut|wc|ls|stat|file|diff|sha256sum|type|echo|printf|test|tr|Get-Content|gc|git +(?:add|commit)|gh +(?:pr|issue))(?: +(?:(?:--[a-z-]+=)?(?:''(?:[^-''‘-‛]-*)*''|"(?:(?:\\?[^-"`$\\“-„]|\\\\|\$\{[A-Z_]+\}|\$[A-Z_a-z])-*)*")|(?:[!%*-,.-:=?-\[\]-_a-{}~]|-+[!*-,.-:=?-\[\]-_a-{}~]|\$[A-Z_a-z])*-*))*|git +(?:diff|log|show|blame|status|grep|ls-files|ls-tree)(?: +(?:''(?:[^-''‘-‛]-*)*''|[!*-:=?-\[\]-_a-z~]*))*|sed +-n +(?:''[^''weW‘-‛]*p''|[0-9,]+p)[^-;&|<>`$()''"\n\r\\]*|(?:sort|uniq)(?: +-[a-np-z]+)* *|python3? +-m +json\.tool *)(?:2>/dev/null *)?(?:[|\n]\s*|(?: +#[^\n\r]*)?$))*)$'
      condition: selection
    tags: [self-protection, hooks, defense-evasion]
    explanation: >-
      A shell command names hook settings after a program at command position that can write, move, delete or change permissions (`rm`, `tee`, `dd of=`, `install`, `sed -i`, interpreter one-liners), in the same command unless it is an interpreter one-liner. `--rm` and words after other whitespace do not count; redirections are hook_settings_redirect.
    falsepositives:
      - Operators uninstalling or reconfiguring hooks by hand.
      - A backup copy taken from the settings file.
  - id: tth.tamper.hook_settings_modify_windows
