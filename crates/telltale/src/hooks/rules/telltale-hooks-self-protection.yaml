name: tth.tamper.disable_all_hooks
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_arguments:
        tool.arguments|re|i: 'disableAllHooks"?\s*[:=]?\s*(?:true|1)\b'
    selection_command:
        tool.command|re|i: 'disableAllHooks"?\s*[:=]?\s*(?:true|1)\b'
    filter_command:
        tool.command|re|i: '^\s*{{READERS}}$'
    condition: selection_arguments or (selection_command and not filter_command)
falsepositives:
    - 'Documentation that quotes the setting.'
level: high
telltale:
    category: approval_bypass
    score: 90
    explanation: 'Tool arguments or a command carry a setting that turns off every configured hook, including `claude config set [-g] disableAllHooks true|1`. A plain read or a `git commit` that quotes the setting is not matched. Content written with the native Write tool is not visible to Rule v1 targets; the path rules cover that case.'
    tags: [self-protection, hooks, defense-evasion]
---
title: Agent launches a harness with hooks turned off
id: f7635873-439a-4966-9b8a-4d21dda08614
name: tth.tamper.hookless_harness_launch
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i|recorded_exclusion: '(?:{{COMMAND_START}}(?:["''](?:[^"''\n]*[\\/])?|[^\s;&|"'']*[\\/])?(?:claude(?:\.exe|\.cmd)?["'']?\s{{SEGMENT}}--bare\b|opencode(?:\.exe|\.cmd)?["'']?\s{{SEGMENT}}--pure\b|codex(?:\.exe|\.cmd)?["'']?\s{{SEGMENT}}(?:--disable[\s=]+["'']?(?:codex_)?hooks\b|(?:-c\s*|--config[\s=]+)["'']?features(?:\.(?:codex_)?hooks\s*=\s*["'']?false|\s*=\s*\{[^}]*hooks\s*=\s*false)|--ignore-user-config\b|--ignore-rules\b|features\s+disable\s+(?:codex_)?hooks\b))|\bCLAUDE_CODE_SIMPLE=\s*["'']?(?:1|true)\b)'
    filter_command:
        tool.command|re|i|recorded_exclusion: '{{VERSION_OR_HELP}}'
    condition: selection_command and not filter_command
falsepositives:
    - 'A user deliberately starting a minimal harness session for testing.'
level: high
telltale:
    category: approval_bypass
    score: 90
    explanation: 'Claude Code --bare (CLAUDE_CODE_SIMPLE) turns off user, project and flag hooks and SessionStart, so a user-scope install does not survive it; managed hooks did still fire on tool events in real runs, contrary to the binary''s schema text. opencode --pure skips plugins. Codex: --disable hooks and -c features.hooks=false (also the legacy key codex_hooks, --config, an inline features table, and the persistent `codex features disable hooks`) turn hooks off; exec --ignore-user-config skips the file that holds hook trust records, and exec --ignore-rules skips the exec-policy backstop (Codex source rust-v0.166.0: cli/src/main.rs, features/src/legacy.rs, exec/src/cli.rs). The harness must be at command position, so `grep ''codex --disable hooks'' docs/` does not match; `--help` and `--version` alone do not match.'
    tags: [self-protection, hooks, defense-evasion, nested-agent]
---
title: Agent launches a harness with another configuration home
id: 01b949f5-390b-4944-8243-3c6962e8a4a9
name: tth.tamper.harness_home_override
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i|recorded_exclusion: '(?s)(?:\b(?:CODEX_HOME|COPILOT_HOME)=(?:"[^"]*"|''[^'']*''|\S*)\s+(?:[^\s=]+=\S*\s+|(?:env|exec|nohup|sudo|command|time)\s+)*(?:["''](?:[^"''\n]*[\\/])?|[^\s;&|"'']*[\\/])?(?:codex|copilot)(?:\.exe|\.cmd)?["'']?(?:[\s;&|)`]|$)|(?:\bexport\s+(?:CODEX_HOME|COPILOT_HOME)\b|\bset\s+["'']?(?:CODEX_HOME|COPILOT_HOME)=|\$env:(?:CODEX_HOME|COPILOT_HOME)\s*=).*{{COMMAND_START}}(?:["''](?:[^"''\n]*[\\/])?|[^\s;&|"'']*[\\/])?(?:codex|copilot)(?:\.exe|\.cmd)?["'']?(?:[\s;&|)`]|$))'
    filter_command:
        tool.command|re|i|recorded_exclusion: '{{VERSION_OR_HELP}}'
    condition: selection_command and not filter_command
falsepositives:
    - 'Test harnesses that run a harness under a disposable home on purpose.'
level: high
telltale:
    category: approval_bypass
    score: 90
    explanation: '`CODEX_HOME=<other> codex` and `COPILOT_HOME=<other> copilot` (inline, `env`, `export` then launch, PowerShell `$env:`, cmd.exe `set`) start a session that skips the user-level hooks of the real home. The value is not compared with the current home: a regex cannot. An `export` without a launch in the same command is inert. `--help` and `--version` alone do not match.'
    tags: [self-protection, hooks, defense-evasion, nested-agent]
