title: 'Agent command names a harness package runner or the hook''s uninstall'
id: 95bf368f-9c3c-4846-9879-977ed42baf32
name: tth.tamper.hook_removal_failsafe
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i|recorded_exclusion: '(?s)(?:(?:^|[^-A-Za-z0-9_.])(?:npx|pnpx|bunx|dlx|npm\s+(?:exec|x))\s.*{{HARNESS_PACKAGES}}\b|\btelltale(?:-hooks(?:\.exe)?|(?:\.exe)?\s+hooks)\s.*(?:\buninstall\b|--allow-user-hooks\b))'
    filter_command:
        tool.command|re|i|recorded_exclusion: '^\s*(?:cd +[!*-:=?-\[\]-_a-{}~]+ *(?:&&|;)\s*)*{{READERS}}$|{{DRY_RUN_OR_HELP}}'
