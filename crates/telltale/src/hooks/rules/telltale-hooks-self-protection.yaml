title: Agent launches Codex with hook trust bypassed
id: e268ab1f-6866-49ed-8c55-0d99412a878f
name: tth.tamper.hook_trust_bypass
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i|recorded_exclusion: '{{COMMAND_START}}(?:["''](?:[^"''\n]*[\\/])?|[^\s;&|"'']*[\\/])?codex(?:\.exe|\.cmd)?["'']?\s{{SEGMENT}}--dangerously-bypass-hook-trust\b'
    filter_command:
        tool.command|re|i|recorded_exclusion: '{{VERSION_OR_HELP}}'
    condition: selection_command and not filter_command
falsepositives:
    - 'A user deliberately running a nested Codex with unreviewed hooks.'
level: high
telltale:
    category: approval_bypass
    score: 90
    explanation: '`codex --dangerously-bypass-hook-trust` keeps hooks on, including this one, so it is not a hookless launch. It runs every enabled hook whether or not the user reviewed it (Codex source rust-v0.166.0, hooks/src/engine/discovery.rs), so a hook the agent planted in a project or a custom home runs without review. It has its own rule so that telemetry and operators can tell it apart: an unattended pipeline that passes this flag itself is not an agent launch and never reaches this rule, and an operator who wants nested agents to use it can disable this rule without touching hookless_harness_launch.'
    tags: [self-protection, hooks, defense-evasion, nested-agent]
