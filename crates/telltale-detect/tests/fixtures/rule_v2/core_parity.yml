detection:
    selection:
        - tool.command|re|i: &pattern '(curl|wget|fetch|Invoke-WebRequest)\s+.*([A-Za-z0-9+/]*[+/=][A-Za-z0-9+/=]{39,}|[A-Za-z0-9+/]{40,}[+/=][A-Za-z0-9+/=]*).*https?://|(curl|wget|fetch|Invoke-WebRequest)\s+.*https?://.*(?:--data|--data-binary|--data-raw|[\s]-d(?:[\s=@A-Za-z0-9])).*(?:[A-Za-z0-9+/]*[+/=][A-Za-z0-9+/=]{39,}|[A-Za-z0-9+/]{40,}[+/=][A-Za-z0-9+/=]*)|(curl|wget|fetch)\s+.*https?://[A-Za-z0-9+/]{20,}\.[a-z]{2,}'
        - tool.arguments|re|i: *pattern
    condition: selection
falsepositives:
    - Tests or API calls may send encoded payloads over HTTP when the destination and data are expected.
    - Long unencoded tokens, IDs, or test vectors without base64 special characters are not encoded HTTP.
level: high
tags:
    - atlas.aml.t0025
telltale:
    category: exfiltration
    score: 50
    explanation: Encoded hostname or base64 request material sent through an HTTP client.
    analytic_intent: alert
    detection_class: security_detection
    signal_type: atomic
    tags: [exfiltration, encoding, network]
---
title: Secret access followed by network egress
id: 4e9f6a0b-1c2d-4e3f-94a5-b6c7d8e9fa0b
name: chain.secret_then_network
taxonomy: telltale
status: stable
correlation:
    type: telltale_chain
    categories: [secret_access, exfiltration]
    within_calls: 3
falsepositives:
    - Authorized backup or migration work may read secret files and upload artifacts; confirm the destination and the request before escalating.
telltale:
    score: 35
    explanation: Secret access followed by outbound transfer materially increases exfiltration risk.
---
title: Download followed by execution
id: 5fa07b1c-2d3e-4f4a-a5b6-c7d8e9fa0b1c
name: chain.download_then_execute
taxonomy: telltale
status: stable
correlation:
    type: telltale_chain
    categories: [download, execution]
falsepositives:
    - Normal installer workflows often download and execute setup scripts; validate the source, checksum, and explicit user request.
telltale:
    score: 35
    explanation: Download followed by execution is a common malware pattern.
---
title: Shell execution of an encoded payload
id: 6a1b8c2d-3e4f-4a5b-b6c7-d8e9fa0b1c2d
name: chain.shell_encoded_payload
taxonomy: telltale
status: stable
correlation:
    type: telltale_chain
    rules: [execution.shell, execution.encoded_payload]
    within_calls: 0
    order: any
falsepositives:
    - Incident response, parser tests, or build tooling may decode payloads under operator control; review whether decoded content was executed or only inspected.
telltale:
    score: 10
    explanation: Shell execution of decoded payload content should cross the triage threshold.
