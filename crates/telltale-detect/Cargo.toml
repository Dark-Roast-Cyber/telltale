[package]
name = "telltale-detect"
version.workspace = true
edition.workspace = true
description = "Telltale detection pipeline: rule evaluation over parsed sessions, timelines, baselines, correlation, and MCP analysis"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/telltale-detect"
readme = "README.md"
keywords = ["security", "detection", "sessions", "correlation"]
categories = ["development-tools", "parser-implementations"]
include = ["/Cargo.toml", "/README.md", "/LICENSE", "build.rs", "/src/**", "/tests/fixtures/**"]

[features]
default = ["source-io"]
source-io = ["dep:telltale-sources", "dep:walkdir"]

[dependencies]
telltale-schema.workspace = true
telltale-rules.workspace = true
telltale-sources = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
time.workspace = true
walkdir = { version = "2.5", optional = true }

[dev-dependencies]
tempfile = "3.14"
rusqlite = { version = "0.32", features = ["bundled"] }
