documents:
  # packs/test/git-hook-persistence.yaml
  - version: 1
    description: Community detection of repository Git-hook persistence changes in agent sessions.
    defaults:
      case_insensitive: true
      enabled: true
    rules:
      - id: tdx.persistence.git_hook_change
        title: Git hook path or hook program changed by an agent
        status: test
        category: persistence
        detection_class: security_detection
        signal_type: atomic
        analytic_intent: alert
        severity: high
        score: 50
        targets: [command, arguments]
        regex: '(git\s+config(?:\s+--(?:local|global|system))?\s+core\.hooksPath\s+\S+|(?s:(\.git[\\/]hooks[\\/][A-Za-z0-9._-]+.{0,400}#!|#!.{0,400}\.git[\\/]hooks[\\/][A-Za-z0-9._-]+)))'
        tags: [git, hooks, persistence, repository]
        explanation: An agent changes core.hooksPath or writes shebang-bearing content to a repository hook path, which can execute code during later Git operations.
        falsepositives:
          - Authorized repository setup may install versioned hooks or configure a team-approved hooks directory.
          - Hook framework installation may create executable hook shims as part of an explicitly requested developer setup.
    modifiers: []
  # packs/test/mcp-server-registration.yaml
  - version: 1
    description: Community detection of MCP server registration commands in agent sessions.
    defaults:
      case_insensitive: true
      enabled: true
    rules:
      - id: tdx.persistence.mcp_server_registration
        title: MCP server registered by an agent command
        status: test
        category: persistence
        detection_class: security_detection
        signal_type: atomic
        analytic_intent: alert
        severity: medium
        score: 40
        targets: [command, arguments]
        regex: '(^|[\s''"])(codex|claude|opencode)\s+mcp\s+add\b'
        tags: [mcp, tool-surface, configuration, persistence]
        explanation: An agent invokes a supported client command that registers a new MCP server and expands the tools available in later sessions.
        falsepositives:
          - Authorized developer setup may register an approved local or organizational MCP server.
          - Integration tests may exercise an MCP add command against a synthetic server.
    modifiers: []
  # packs/test/windows-agent-persistence.yaml
  - version: 1
    description: Community command-level Windows persistence detections for agent sessions.
    defaults:
      case_insensitive: true
      enabled: true
    rules:
      - id: tdx.persistence.windows_agent_command
        title: Windows persistence command in an agent tool call
        status: test
        category: persistence
        detection_class: security_detection
        signal_type: atomic
        analytic_intent: alert
        severity: high
        score: 55
        targets: [command, arguments]
        regex: '(schtasks(?:\.exe)?\s+.{0,200}/create\b|reg(?:\.exe)?\s+add\s+.{0,240}(currentversion[\\/]+run(?:once)?\b|[\\/]+winlogon[\\/]+)|(?:copy|move|xcopy|robocopy)\s+.{0,240}(startup|start menu[\\/]+programs[\\/]+startup))'
        tags: [windows, persistence, scheduled-task, run-key, startup-folder]
        explanation: An agent tool call attempts a Windows scheduled-task, autorun-key, or startup-folder persistence change without requiring process parent-child telemetry.
        falsepositives:
          - Authorized endpoint administration may create scheduled tasks, configure approved autorun software, or install a requested startup shortcut.
    modifiers: []
