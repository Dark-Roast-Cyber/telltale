id: 51dcf092-f84d-4c8a-9e62-6721494bb644
name: tdx.persistence.mcp_server_registration
taxonomy: telltale
status: test
description: 'Matches named mcp add requests for Codex, Claude Code and OpenCode, and the bare opencode mcp add wizard, which durably expand the agent''s tool surface. A match identifies a requested operation, not a completed registration or a trusted server.'
