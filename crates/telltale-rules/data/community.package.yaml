author: Telltale community detections
license: Apache-2.0
date: 2026-10-13
modified: 2026-11-18
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection:
        - tool.command|re|i: &pattern '(?:^|[\s''";&|])(?:(?:codex|claude|opencode)[ \t]+mcp[ \t]+add[ \t]+(?:(?:--client-secret|(?:--(?:bearer-token-env-var|callback-port|client-id|env|header|scope|transport|url)|-[Hest])(?:[ \t]+|=)(?:\\?[''"][^''"\r\n]*\\?[''"]|[^\s''";&|<>]+))[ \t]+)*(?:--[ \t]+)?(?:\\?[''"])?[a-z0-9_.$]|opencode[ \t]+mcp[ \t]+add[ \t]*(?:$|[;&|\r\n<>]|\\?[''"][ \t]*(?:$|[,;&|}\]\r\n<>])))'
