taxonomy: telltale
status: stable
correlation:
    type: telltale_chain
    categories: [instruction_override, approval_bypass]
    within_calls: 3
    order: any
falsepositives:
    - 'The two phrases link within three tool calls of each other in either order, not per message or field; an override phrase in one assistant message and an unrelated approval-bypass phrase nearby (including a tool result or command) can trigger this chain, as can security documentation that quotes both phrases without the documentation markers the exclusions recognize.'
tags:
    - atlas.aml.t0051
telltale:
    score: 30
    explanation: 'An instruction override co-occurring with an approval-bypass directive in assistant output requires security review.'
    analytic_intent: alert
    detection_class: security_detection
    signal_type: chain
