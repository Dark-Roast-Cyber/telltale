title: Credential-like token in tool context
id: 065b86f7-94a3-4e98-bd21-f378b77e2cd3
name: credential.api_key.pattern
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: agent_activity
detection:
    selection:
        - tool.command|re|i: &pattern '((?:^|[^A-Za-z0-9_\-])(?-i:sk-)[A-Za-z0-9_\-]{16,}|(?:^|[^A-Za-z0-9_\-])(?-i:gh[pousr]_)[A-Za-z0-9_]{20,}|(?:^|[^A-Za-z0-9_\-])(?-i:xox[baprs]-)[A-Za-z0-9\-]{20,}|(?:^|[^A-Za-z0-9_\-])(?-i:AKIA)[0-9A-Z]{16}|(?:^|[^A-Za-z0-9_\-])eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}|(?:^|[^A-Za-z0-9_\-])Bearer\s+[A-Za-z0-9._~+\/=\-]{20,})'
        - tool.arguments|re|i: *pattern
        - tool.result|re|i: *pattern
        - message.assistant_text|re|i: *pattern
    condition: selection
falsepositives:
    - 'Synthetic examples, redacted fixtures, or documentation may contain token-shaped strings that are not usable credentials.'
level: medium
tags:
    - atlas.aml.t0057
telltale:
    category: credential_pattern
    score: 30
    explanation: 'Credential-like token appeared in tool context.'
    analytic_intent: hunt
    detection_class: threat_hunting
    signal_type: atomic
    tags: [credentials, token-pattern]
