title: Shell or interpreter activity
id: e619964f-d908-4bdc-a7b8-5f419e2e014a
name: execution.shell
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_arguments:
        tool.arguments|re|i: '(^|\b)(bash|sh|zsh|fish|pwsh|powershell|cmd\.exe)\b|python\s+-c|node\s+-e|perl\s+-e|ruby\s+-e'
    selection_command:
        tool.command|re|i: '(^|\b)(bash|sh|zsh|fish|pwsh|powershell|cmd\.exe)\b|python\s+-c|node\s+-e|perl\s+-e|ruby\s+-e'
    selection_tool_kind:
        tool.kind|re|i: '^shell$'
    condition: 1 of selection_*
falsepositives:
    - 'Normal development tasks frequently use shells or one-line interpreters; chain with other risky behavior before escalating.'
level: low
tags:
    - atlas.aml.t0050
telltale:
    category: execution
    score: 15
    explanation: 'Shell or interpreter activity was recorded.'
    tags: [execution]
