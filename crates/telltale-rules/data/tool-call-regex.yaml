title: Private key access
id: 490e09f2-2142-4964-bbd7-ce27aff0d81a
name: secret.private_key.read
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection:
        - tool.command|re|i: &pattern '((?:id_rsa|id_ed25519)(?:$|[^.]|\.(?:$|[^p]|p(?:$|[^u]|u(?:$|[^b]))))|\.pem|\.p12|BEGIN\s+(?:RSA|OPENSSH|EC|DSA)?\s*PRIVATE\s+KEY)'
        - tool.arguments|re|i: *pattern
        - tool.path|re|i: *pattern
        - tool.result|re|i: *pattern
    condition: selection
falsepositives:
    - 'Certificate inventory, key-format documentation, or authorized SSH troubleshooting can mention private-key filenames without malicious intent.'
level: high
tags:
    - atlas.aml.t0055
telltale:
    category: secret_access
    score: 55
    explanation: 'Private key access is high risk and should match explicit user intent.'
    tags: [credentials, private-key]
