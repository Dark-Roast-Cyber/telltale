title: Outbound upload or object-storage copy in a tool call
id: 93f79139-1822-43a0-b81e-f4583fb824ad
name: exfil.outbound_upload
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
