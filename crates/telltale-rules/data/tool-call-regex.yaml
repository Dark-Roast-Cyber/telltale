title: Encoded payload decoding
id: d3316858-6e92-436b-be5e-321f671fe4b0
name: execution.encoded_payload
taxonomy: telltale
status: stable
logsource:
    product: ai_agent
    category: tool_activity
description: Recorded command text runs decoded content directly, decodes with certutil, or decodes to an executable-looking file that the same command then runs; it does not establish that the decoded content ran.
modified: 2026-11-20
detection:
    selection:
        - tool.command|re|i: &pattern '(?:base64\s+(?:-d|--decode)|openssl\s+enc|xxd\s+-r)(?:(?:[^;&\n]|\d?>&\d)*\|\s*(?:sudo(?:\s+-\S+)*\s+)?(?:\S*/)?(?:(?:(?:ba|z|da|k|fi|pw)?sh|powershell|iex)(?:[\s;&|)"''`#]|$)|(?:python[\d.]*|perl|ruby|node|php)(?:\s+(?:-(?:[^\sm]\S*)?|\S*[<>]\S*))*\s*(?:$|[;&|)"''`#]))|[^;&|\n]*(?:>|\s-o\s|\s-out\s)\s*["'']?(?:/tmp/|/dev/shm/|[^\s;&|"'']*\.(?:\w*sh|p[ylhs]\w*|rb|js|bat|cmd|vbs|exe|bin|so)\b)[^\n]*?(?:[;&|\n]|sudo)\s*(?:(?:(?:ba|z|da|k|fi|pw)?sh|powershell|source|\.|python[\d.]*|perl|ruby|node|php)(?:\s+-\S+)*\s+[^-\s;&|]|chmod\s+(?:\S*\+\w*x|[0-7]*[1357][0-7]*\b)|(?:start|call)\b|\.?/))|(?:\beval|source|\.|\b(?:(?:ba|z|da|k|fi|pw)?sh|powershell|python[\d.]*|perl|ruby|node|php)(?:\s+-\S*)*)\s+["'']?(?:\$\(|<\(|`)[^)`\n]*(?:base64\s+(?:-d|--decode)|openssl\s+enc|xxd\s+-r)|\w+=["'']?\$\([^)\n]*(?:base64\s+(?:-d|--decode)|openssl\s+enc|xxd\s+-r)[^\n]*?\beval\s+["'']?\$|(?:\biex\b|invoke-ex|scriptblock\]::create)[^\n]*FromBase64String|FromBase64String[^\n]*(?:\biex\b|invoke-ex)|certutil[^;&|\n]*\s[-/]decode'
        - tool.arguments|re|i: *pattern
    condition: selection
falsepositives:
    - 'Installers and incident-response tasks may run decoded scripts under operator control.'
    - 'Matches decoded output piped to a shell or to an interpreter reading standard input, substituted into eval, source, a shell or an interpreter, assigned to a variable that eval runs, or passed to PowerShell Invoke-Expression; and decoded output written to an executable-looking file (a script or binary extension, or a path under /tmp or /dev/shm) followed by a shell, interpreter, source, chmod adding execute, start, call or an explicit path. Other decoding matches only obfuscation.decode.'
    - 'Every certutil decode matches, including certificate handling, because certutil decoding is a common way to stage payloads.'
level: high
tags:
    - atlas.aml.t0050
telltale:
    category: execution
    score: 50
    explanation: 'Encoded content was decoded and run in the same command, or decoded with certutil.'
    tags: [execution, obfuscation]
---
title: Encoded content decoded
id: 0c5d7a3e-6f1b-4b8e-9d2a-7e4c1f9b3a65
name: obfuscation.decode
taxonomy: telltale
status: stable
description: Recorded command text decodes encoded content. It carries no points and marks every decode on the timeline, whether or not the same command runs the result.
modified: 2026-11-20
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i: &decode '(?:base64\s+(?:-d|--decode)|openssl\s+enc|certutil[^;&|\n]*\s[-/]decode|FromBase64String|xxd\s+-r|echo\s+[A-Za-z0-9+/]{80,}={0,2}\s*\|)'
    selection_arguments:
        tool.arguments|re|i: *decode
    condition: 1 of selection_*
falsepositives:
    - 'Developers routinely decode fixtures, certificates, keys and API payloads.'
level: informational
tags:
    - atlas.aml.t0050
telltale:
    category: defense_evasion
    score: 0
    explanation: 'Encoded content was decoded. This zero-point hunt signal marks the decode on the timeline; execution.encoded_payload scores decoding that the same command runs.'
    analytic_intent: hunt
    detection_class: threat_hunting
    signal_type: atomic
    tags: [obfuscation, decode]
