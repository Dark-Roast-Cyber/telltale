# Test-only custom Telltale rules using Sigma-inspired detection selection.
title: Custom malicious agent behavior
id: 4ba923a2-5eda-45b1-bd42-7eda11a881ed
name: custom.agent.malicious_behavior
taxonomy: telltale
status: experimental
references:
    - https://example.invalid/telltale-custom-rule
author: 'telltale-test'
logsource:
    product: ai_agent
    category: agent_activity
detection:
    selection_arguments:
        tool.arguments|re|i: 'exfiltrate project secrets'
    selection_assistant_context:
        message.assistant_text|re|i: 'exfiltrate project secrets'
    selection_tool_result:
        tool.result|re|i: 'exfiltrate project secrets'
    condition: 1 of selection_*
falsepositives:
    - 'Synthetic fixture text.'
level: high
telltale:
    category: custom_agent_behavior
    score: 70
    explanation: 'User-defined rule for suspicious agent behavior.'
    tags: [custom, agent-behavior]
