title: Agent command requests container-mediated host filesystem or namespace access
id: 7b2c9d3e-4f5a-4b6c-87d8-e9fa0b1c2d3e
name: tdx.privilege_escalation.container_host_escape
taxonomy: telltale
status: experimental
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection_command:
        tool.command|re|i: '(?:\bmount\b(?:[^;&|\n]|\\\r?\n){0,120}?\s-t\s*virtiofs\s+[^\s;&|]+\s+[^\s;&|]|\b(?:docker|podman|nerdctl)\b(?:\s+-[\w-]+(?:[=\s]+[^\s;&|-][^\s;&|]*)?){0,8}(?:\s+container)?\s+(?:run|create)\b(?:[^;&|\n]|\\\r?\n){0,600}?(?:\s(?:-v|--volume)(?:\s+|=)\\{0,7}[\"'']?/:|\s--mount(?:\s+|=)\\{0,7}[\"'']?[^\s;&|]*?\b(?:source|src)=/(?:,|\\{0,7}[\"'']|\s|$))|\bnsenter\b(?:[^;&|\n]|\\\r?\n){0,120}?\s(?:-t\s*1|--target(?:\s+|=)1)(?:\s|$)|(?:--unix-socket(?:\s+|=)[^\s;&|]*docker\.sock|\bhttps?://[^\s;&|]*?/containers/create(?:[^\w./]|$))(?:[^;&|\n]|\\\r?\n){0,600}?\\{0,7}[\"''](?:privileged\\{0,7}[\"'']\s*:\s*true|(?:binds\\{0,7}[\"'']\s*:\s*\[|source\\{0,7}[\"'']\s*:)\s*\\{0,7}[\"'']/(?::|\\{0,7}[\"'']))|\\{0,7}[\"''](?:privileged\\{0,7}[\"'']\s*:\s*true|(?:binds\\{0,7}[\"'']\s*:\s*\[|source\\{0,7}[\"'']\s*:)\s*\\{0,7}[\"'']/(?::|\\{0,7}[\"'']))(?:[^;&|\n]|\\\r?\n){0,600}?(?:--unix-socket(?:\s+|=)[^\s;&|]*docker\.sock|\bhttps?://[^\s;&|]*?/containers/create(?:[^\w./]|$)))'
    selection_arguments:
        tool.arguments|re|i: '(?:\bmount\b(?:[^;&|\n]|\\\r?\n){0,120}?\s-t\s*virtiofs\s+[^\s;&|]+\s+[^\s;&|]|\b(?:docker|podman|nerdctl)\b(?:\s+-[\w-]+(?:[=\s]+[^\s;&|-][^\s;&|]*)?){0,8}(?:\s+container)?\s+(?:run|create)\b(?:[^;&|\n]|\\\r?\n){0,600}?(?:\s(?:-v|--volume)(?:\s+|=)\\{0,7}[\"'']?/:|\s--mount(?:\s+|=)\\{0,7}[\"'']?[^\s;&|]*?\b(?:source|src)=/(?:,|\\{0,7}[\"'']|\s|$))|\bnsenter\b(?:[^;&|\n]|\\\r?\n){0,120}?\s(?:-t\s*1|--target(?:\s+|=)1)(?:\s|$)|(?:--unix-socket(?:\s+|=)[^\s;&|]*docker\.sock|\bhttps?://[^\s;&|]*?/containers/create(?:[^\w./]|$))(?:[^;&|\n]|\\\r?\n){0,600}?\\{0,7}[\"''](?:privileged\\{0,7}[\"'']\s*:\s*true|(?:binds\\{0,7}[\"'']\s*:\s*\[|source\\{0,7}[\"'']\s*:)\s*\\{0,7}[\"'']/(?::|\\{0,7}[\"'']))|\\{0,7}[\"''](?:privileged\\{0,7}[\"'']\s*:\s*true|(?:binds\\{0,7}[\"'']\s*:\s*\[|source\\{0,7}[\"'']\s*:)\s*\\{0,7}[\"'']/(?::|\\{0,7}[\"'']))(?:[^;&|\n]|\\\r?\n){0,600}?(?:--unix-socket(?:\s+|=)[^\s;&|]*docker\.sock|\bhttps?://[^\s;&|]*?/containers/create(?:[^\w./]|$)))'
    condition: 1 of selection_*
falsepositives:
    - Monitoring agents such as node-exporter or cAdvisor are commonly started with the host root mounted read-only.
    - Requested host recovery or forensics work may mount the host root into a container or use nsenter on purpose.
    - Developers working inside a VM guest may mount a virtiofs share they configured themselves.
    - Requested CI or remote host maintenance may create privileged or host-root containers on a remote daemon on purpose.
level: high
telltale:
    category: privilege_escalation
    score: 50
    analytic_intent: alert
    detection_class: security_detection
    signal_type: atomic
    explanation: An agent tool request includes a virtiofs mount, a host-root container bind on a local or remote daemon, PID 1 namespace entry, or a Docker Engine API create request, over the Unix socket or a TCP endpoint, containing privileged or host-root settings. These can enable host access when permissions and runtime configuration allow it; the command alone does not prove a sandbox escape, a successful mount, or execution.
    tags: [container, docker, sandbox-escape, privilege-escalation, host-mount]
