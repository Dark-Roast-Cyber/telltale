title: Privileged or socket-mounted container launched by an agent
id: 8c3d0e4f-5a6b-4c7d-98e9-fa0b1c2d3e4f
name: tdx.privilege_escalation.container_privileged_launch
taxonomy: telltale
status: experimental
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection:
        - tool.command|re|i: &pattern '(?:\b(?:docker|podman|nerdctl)\b(?:\s+-[\w-]+(?:[=\s]+[^\s;&|-][^\s;&|]*)?){0,8}(?:\s+container)?\s+(?:run|create)\b(?:[^;&|\n]|\\\r?\n){0,600}?\s(?:--privileged\b|--pid(?:\s+|=)\\{0,7}[\"'']?host\b|--cap-add(?:\s+|=)(?:cap_)?(?:sys_admin|all)\b|--security-opt(?:\s+|=)\\{0,7}[\"'']?(?:seccomp|apparmor)[=:]unconfined|(?:-v|--volume|--mount)(?:\s+|=)[^\s;&|]*docker\.sock)|\bcurl\b(?:[^;&|\n]|\\\r?\n){0,200}?--unix-socket(?:\s+|=)\\{0,7}[\"'']?[^\s;&|]*docker\.sock)'
        - tool.arguments|re|i: *pattern
    condition: selection
falsepositives:
    - Docker-in-Docker, KinD, and testcontainers setups routinely mount the Docker socket or run privileged.
    - Hardware, eBPF, and profiling work often needs privileged containers or added capabilities.
    - Scripts that query the Docker API socket for container status match without creating anything.
level: low
telltale:
    category: privilege_escalation
    score: 20
    analytic_intent: hunt
    detection_class: security_detection
    signal_type: atomic
    explanation: An agent tool request specifies privileged container options, broad capabilities, relaxed confinement, or a daemon-socket mount, on a local or remote daemon, or makes a curl request to the Docker socket. The command is a host-access prerequisite, not evidence that the container was created or that isolation was bypassed.
    tags: [container, docker, privileged, docker-socket, privilege-escalation]
