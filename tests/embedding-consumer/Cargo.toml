[package]
name = "telltale-embedding-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Resolve as an external application, independently of the CLI's features/lock.
[workspace]

# This external workspace does not inherit the repository's dev/test profile.
# Keep incremental rebuilds and backtraces without full type/variable debug data.
[profile.dev]
debug = 1

# The repository workspace optimizes its dependencies. Without that, regex
# compilation of the bundled rules dominates every test that builds a pipeline.
# Only the regex crates: the Telltale crates are not members here.
[profile.dev.package.regex]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
[profile.dev.package.aho-corasick]
opt-level = 2
[profile.dev.package.memchr]
opt-level = 2

[features]
default = []
opencode-sqlite = ["telltale-core/opencode-sqlite"]
protected-assignment = ["telltale-core/protected-assignment"]
sqlx-sqlite = ["dep:sqlx"]

[dependencies]
telltale-core = { path = "../../crates/telltale", version = "=0.7.2", default-features = false }
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros"], optional = true }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.14"
