      expected_score: 0
      expected_contributions: []
    tags: [seed, opencode, routine, efficacy, characterization]

  - id: OC-NT-001
    description: OpenCode UC-001 tool result with MCP injection and controlled egress
    input:
      kind: source_fixture
      fixture: tests/fixtures/session_stores/opencode/storage/message/session-b/message-b.json
      client: opencode
      source_id: opencode.legacy_json
      source_kind: legacy_json
    eventfulness: noteworthy
    disposition: malicious
    expected_security_review: required
    label_rationale: Synthetic MCP prompt injection followed by attempted controlled-domain egress is intentionally high-signal and should require security review.
    expected_visibility:
      required_record_kinds: [tool_result]
      optional_fields: [timestamp, tool_name, arguments, agent, model, provider]
      unavailable_fields: [pid, parent_pid]
    expected_detection:
      rule_expectations:
        - rule_id: mcp.tool_metadata.prompt_injection
          expectation: expected_match
        - rule_id: network.controlled_test_domain.darkroast
          expectation: expected_match
        - rule_id: chain.mcp_injection_then_egress
          expectation: expected_match
      exact_rule_set: false
      expected_score: 185
      expected_contributions:
        - id: approval.bypass.context
          type: deterministic_rule
          points: 45
        - id: mcp.tool_metadata.prompt_injection
          type: deterministic_rule
          points: 60
        - id: network.controlled_test_domain.darkroast
          type: deterministic_rule
          points: 45
        - id: chain.mcp_injection_then_egress
          type: chain_modifier
          points: 35
    tags: [seed, opencode, uc001, efficacy, characterization]

