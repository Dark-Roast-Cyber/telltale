      client: opencode
      source_id: opencode.legacy_json
      source_kind: legacy_json
    eventfulness: uneventful
    disposition: not_applicable
    expected_security_review: not_scored
    label_rationale: Uneventful assistant-only activity has no independent analyst security-review contract; it is a parser and visibility seed.
    expected_visibility:
      required_record_kinds: [assistant_message]
      optional_fields: [timestamp, agent, model, provider]
      unavailable_fields: [pid, parent_pid]
    expected_detection:
      rule_expectations: []
      exact_rule_set: true
      expected_score: 0
      expected_contributions: []
    tags: [seed, opencode, source_conformance, characterization]

  - id: OC-RT-001
    description: OpenCode routine source read synthesized without a shell invocation
    input:
      kind: normalized_records
      client: opencode
      records:
        - session_id: opencode-routine-read
          kind: tool_call
          tool_name: read_file
          arguments: '{"path":"src/lib.rs"}'
          content: Read src/lib.rs.
    eventfulness: routine
    disposition: benign
    expected_security_review: not_required
    label_rationale: Routine user-authorized repository inspection should not require security review.
    expected_visibility:
      required_record_kinds: [tool_call]
      optional_fields: [tool_name, arguments, content]
      unavailable_fields: [pid, parent_pid]
    expected_detection:
      rule_expectations: []
