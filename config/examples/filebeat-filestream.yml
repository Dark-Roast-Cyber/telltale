filebeat.inputs:
  - type: filestream
    id: telltale-jsonl
    paths:
      - /var/log/telltale/telltale-events.jsonl
    parsers:
      - ndjson:
          target: ""
          add_error_key: true

fields:
  service.name: telltale
  event.module: agentic_detection_response
fields_under_root: true
