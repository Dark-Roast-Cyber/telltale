# Example policy-violation detections for coding-agent behavior controls.
title: Agent guardrail or policy file modification
id: daf53fb5-a9b2-4a12-bac7-8a940d2a86d0
name: policy.agent_guardrail_modification
taxonomy: telltale
logsource:
    product: ai_agent
    category: tool_activity
detection:
    selection:
        - tool.command|re|i: &pattern '(\.opencode/skills/|\.agents/skills/|\.claude/skills/|AGENTS\.md|CLAUDE\.md|opencode\.json|policy\.ya?ml|guardrail|allowlist|denylist)'
        - tool.arguments|re|i: *pattern
        - tool.path|re|i: *pattern
    condition: selection
falsepositives:
    - 'Legitimate repository maintenance may update agent skills, policy files, or allowlists.'
    - 'Pair this rule with user-intent review before treating it as malicious.'
level: medium
tags:
    - atlas.aml.t0081
telltale:
    category: persistence
    score: 45
    explanation: 'Agent modified or referenced files that can change agent behavior, policy, or guardrails.'
    analytic_intent: audit
    detection_class: policy_violation
    signal_type: atomic
    tags: [policy-violation, agent-guardrails, configuration]
