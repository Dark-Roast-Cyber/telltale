schema: spec-driven

# Project context shown to AI when creating artifacts. This is deliberately
# concise: it carries only the constraints that materially shape proposals.
# The full planning hierarchy lives in the repository's own source-of-truth
# files (AGENTS.md, PLAN.md, VISION.md, .ai/working-state.md) and must not be
# duplicated here. OpenSpec defines executable change contracts for bounded
# batches that PLAN.md selects; it does not replace the roadmap.
context: |
  Rust workspace: Telltale, a batch security monitor for agentic coding
  conversations. Security-sensitive product: never print or commit real API
  keys, .env values, auth files, session contents, or credential-like strings.
  Prefer redacted excerpts and cryptographic hashes for evidence fields.
  Treat local agent session stores as sensitive; tests use fixtures, never
  real transcripts. Logs are designed for SIEM ingestion, so avoid raw full
  conversation bodies by default.

  Deterministic behavior is authoritative. Detection is data-driven in
  config/rules/; avoid burying security regex in code. Preserve the privacy,
  append-only JSONL event model, and detection-versus-action separation.

  Project verification commands (Rust):
    cargo fmt --check
    cargo clippy --all-targets -- -D warnings
    cargo test
  Narrowest relevant verification first, then expand only if needed.

  Planning hierarchy (do not restate in artifacts unless directly relevant):
    VISION.md      -> long-lived product strategy
    PLAN.md        -> active roadmap and batch sequencing
    .ai/working-state.md -> durable cross-session execution state
    Git/tests      -> authoritative implementation state
  OpenSpec role: PLAN selects a bounded batch -> OpenSpec defines its
  executable change contract -> a fresh OpenCode session implements it.

  Prefer small, reviewable, reversible changes. One bounded batch per root
  OpenCode session; batch 1-3 tightly related subtasks only when they share
  one implementation and validation story. Do not broaden scope or combine
  unrelated milestones.

rules:
  proposal:
    - State the exact scope, behavioral contract, compatibility requirements,
      acceptance criteria, and an explicit stop boundary.
    - Keep scope bounded to one PLAN-selected batch; do not bundle unrelated
      milestones or deferred surfaces.
    - Reference the source PLAN batch and working-state evidence rather than
      restating the full roadmap.
    - Include an explicit "Non-goals" section listing deferred surfaces.
  specs:
    - Write delta specs (ADDED/MODIFIED/REMOVED) against current behavior, not
      a full system spec.
    - Use "The system SHALL ..." requirement statements with concrete
      WHEN/THEN scenarios.
    - Do not specify behavior that belongs to a deferred surface; mark it as a
      non-goal in proposal.md instead.
  design:
    - Keep technical approach minimal and reviewable; prefer direct code over
      placeholder traits, generic frameworks, plugin systems, or speculative
      configuration.
    - Preserve CLI, schema, event ordering, state, deduplication, and rule
      semantics unless an intentional migration is documented and tested.
    - Call out cross-platform (Linux/macOS/Windows) implications and any
      release-workflow or public-boundary impact.
  tasks:
    - Break tasks into small, independently verifiable steps.
    - Each implementation task must map to a validation step.
    - "End with: run narrowest verification, then cargo fmt --check, cargo clippy --all-targets -- -D warnings, cargo test."

operations:
  apply:
    guidance:
      - Implement only the tasks in tasks.md; do not broaden scope.
      - Run the narrowest relevant verification first, then expand.
      - Do not change detection/scoring/state-fingerprint semantics, Event 3.0
        SIEM fields, historical schemas/fixtures/hashes, or private host
        architecture unless the change contract explicitly authorizes it.
      - Stop and surface the issue if implementation requires a behavior change,
        public API change, schema change, or security/privacy decision outside
        the proposal's stated scope.
      - Update .ai/working-state.md with the completed batch before stopping.
  archive:
    guidance:
      - Confirm the batch is implemented, reviewed, validated, and committed.
      - Record the handoff in .ai/working-state.md before archiving.
      - Do not start the next major batch; a fresh root session owns that.