[package]
name = "telltale-console"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Read-only local Telltale Event3 console"

[dependencies]
telltale-core.workspace = true
telltale-schema.workspace = true
clap = { version = "4.5", features = ["derive"] }
# Native Glow + X11 (including XWayland), with no persistence or WGPU.
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = { version = "=0.36.1", default-features = false }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.14"
