[workspace]
members = [
    "crates/telltale-schema",
    "crates/telltale-rules",
    "crates/telltale-sources",
    "crates/telltale-detect",
]
default-members = [
    ".",
    "crates/telltale-schema",
    "crates/telltale-rules",
    "crates/telltale-sources",
    "crates/telltale-detect",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Dark-Roast-Cyber/telltale"

[workspace.dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
uuid = { version = "1.11", features = ["v4"] }
telltale-schema = { path = "crates/telltale-schema", version = "0.1.0" }
telltale-rules = { path = "crates/telltale-rules", version = "0.1.0" }
telltale-sources = { path = "crates/telltale-sources", version = "0.1.0" }
telltale-detect = { path = "crates/telltale-detect", version = "0.1.0" }

[package]
name = "adr"
version.workspace = true
edition.workspace = true
description = "Telltale detection layer for AI coding agent sessions"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage = "https://github.com/Dark-Roast-Cyber/telltale"
exclude = [
    "AGENTS.md",
    "PLAN.md",
    "VISION.md",
    "IDEAS.md",
    "docs/internal/**",
    "docs/CHANGELOG.md",
    "docs/research-urls.md",
    "docs/siem-logging.md",
    "docs/splunk-content.md",
    "skills/**",
    ".ai/**",
    "scripts/ralph*",
    "scripts/inspiration/**",
    "tasks/**",
    ".opencode/**",
    "logs/**",
    "state/**",
    "artifacts/**",
    "release-downloads/**",
    "runtime/ralph/**",
    "config/examples/splunk-*.conf",
    "config/examples/splunk-*.xml",
]

[dependencies]
telltale-schema.workspace = true
telltale-rules.workspace = true
telltale-sources.workspace = true
telltale-detect.workspace = true
clap = { version = "4.5", features = ["derive"] }
notify = "8.0"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
time.workspace = true
uuid.workspace = true
walkdir = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.22"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
jsonschema = "0.29"
tempfile = "3.14"

[[bench]]
name = "benchmarks"
harness = false
