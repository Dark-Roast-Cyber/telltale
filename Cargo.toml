[workspace]
members = [
    "crates/telltale-schema",
    "crates/telltale-rules",
    "crates/telltale-sources",
    "crates/telltale-detect",
    "crates/telltale",
]
default-members = [
    ".",
    "crates/telltale-schema",
    "crates/telltale-rules",
    "crates/telltale-sources",
    "crates/telltale-detect",
    "crates/telltale",
]

[workspace.package]
version = "0.5.0-rc.7"
edition = "2024"
license = "Apache-2.0"
authors = ["Dark Roast Cyber"]
homepage = "https://github.com/Dark-Roast-Cyber/telltale"
repository = "https://github.com/Dark-Roast-Cyber/telltale"

[workspace.dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
flate2 = "1.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
uuid = { version = "1.11", features = ["v4"] }
telltale-schema = { path = "crates/telltale-schema", version = "=0.5.0-rc.7" }
telltale-rules = { path = "crates/telltale-rules", version = "=0.5.0-rc.7" }
telltale-sources = { path = "crates/telltale-sources", version = "=0.5.0-rc.7" }
telltale-detect = { path = "crates/telltale-detect", version = "=0.5.0-rc.7" }
telltale-core = { path = "crates/telltale", version = "=0.5.0-rc.7" }

[package]
name = "telltale-cli"
version.workspace = true
edition.workspace = true
default-run = "telltale"
description = "Telltale detection layer for AI coding agent sessions"
license.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "crates/telltale-cli/README.md"
repository.workspace = true
documentation = "https://docs.rs/telltale-cli"
keywords = ["security", "ai", "agents", "detection", "telemetry"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/Cargo.toml",
    "/crates/telltale-cli/README.md",
    "/LICENSE",
    "/build.rs",
    "/benches/benchmarks.rs",
    "/src/**",
    "/schemas/event.schema.json",
    "/schemas/historical/*.json",
    "/schemas/historical/README.md",
    "/config/rules/tool-call-regex.yaml",
    "/tests/fixtures/**",
]

[dependencies]
telltale-schema.workspace = true
telltale-rules.workspace = true
telltale-sources.workspace = true
telltale-detect.workspace = true
clap = { version = "4.5", features = ["derive"] }
notify = "8.0"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
flate2.workspace = true
fs4 = "0.13"
time.workspace = true
uuid.workspace = true
walkdir = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.22"
jsonschema = { version = "0.29", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[[bench]]
name = "benchmarks"
harness = false

[[bin]]
name = "telltale"
path = "src/main.rs"
