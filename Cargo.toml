[workspace]
members = [
    "apps/telltale-console",
    "crates/telltale-schema",
    "crates/telltale-inference",
    "crates/telltale-rules",
    "crates/telltale-sources",
    "crates/telltale-detect",
    "crates/telltale",
]
default-members = [
    ".",
    "crates/telltale-schema",
    "crates/telltale-inference",
    "crates/telltale-rules",
    "crates/telltale-sources",
    "crates/telltale-detect",
    "crates/telltale",
]

[workspace.package]
version = "0.7.0-rc.4"
edition = "2024"
# Embedding crates only; the CLI and console build with rust-toolchain.toml.
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Dark Roast Cyber"]
homepage = "https://github.com/Dark-Roast-Cyber/telltale"
repository = "https://github.com/Dark-Roast-Cyber/telltale"

[workspace.dependencies]
regex = "1.11"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# YAML Organization successor; Cargo's rename preserves the Serde YAML imports.
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
jsonschema = { version = "0.60.1", default-features = false }
sha2 = "0.11"
flate2 = "1.0"
getrandom = "0.4.3"
hmac = "0.13"
hex = "0.4.3"
time = { version = "0.3.47", features = ["formatting", "macros", "parsing"] }
unicode-normalization = "0.1"
uuid = { version = "1.11", features = ["v4"] }
telltale-schema = { path = "crates/telltale-schema", version = "=0.7.0-rc.4" }
telltale-inference = { path = "crates/telltale-inference", version = "=0.7.0-rc.4" }
telltale-rules = { path = "crates/telltale-rules", version = "=0.7.0-rc.4" }
telltale-sources = { path = "crates/telltale-sources", version = "=0.7.0-rc.4" }
telltale-detect = { path = "crates/telltale-detect", version = "=0.7.0-rc.4" }
telltale-core = { path = "crates/telltale", version = "=0.7.0-rc.4" }

[package]
name = "telltale-cli"
version.workspace = true
edition.workspace = true
default-run = "telltale"
description = "Telltale detection layer for AI coding agent sessions"
license.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "crates/telltale-cli/README.md"
repository.workspace = true
documentation = "https://docs.rs/telltale-cli"
keywords = ["security", "ai", "agents", "detection", "telemetry"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/Cargo.toml",
    "/crates/telltale-cli/README.md",
    "/LICENSE",
    "/build.rs",
    "/benches/benchmarks.rs",
    "/src/**",
    "/schemas/event.schema.json",
    "/schemas/historical/*.json",
    "/schemas/historical/README.md",
    "/config/rules/tool-call-regex.yaml",
    "/tests/fixtures/**",
]

[dependencies]
telltale-schema.workspace = true
telltale-rules.workspace = true
telltale-sources = { workspace = true, features = ["opencode-sqlite"] }
telltale-detect.workspace = true
telltale-core = { workspace = true, features = ["opencode-sqlite"] }
clap = { version = "4.5", features = ["derive"] }
notify = "8.0"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
hex.workspace = true
flate2.workspace = true
fs4 = "1.1"
time.workspace = true
uuid.workspace = true
rusqlite.workspace = true
ctrlc = { version = "3.5.2", features = ["termination"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.23"
jsonschema.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.14"
telltale-core.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[[bench]]
name = "benchmarks"
harness = false

[[bin]]
name = "telltale"
path = "src/main.rs"

# Tests inherit this profile. Keep incremental rebuilds and source-level
# backtraces, without retaining full type/variable debug information by default.
[profile.dev]
debug = 1

# Optimize third-party dependencies (bundled SQLite, regex, serde) so integration
# tests do not spend their time in unoptimized library code. Workspace crates
# remain unoptimized.
[profile.dev.package."*"]
opt-level = 2
