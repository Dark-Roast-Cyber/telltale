[package]
name = "adr"
version = "0.1.0"
edition = "2024"
description = "Telltale detection layer for AI coding agent sessions"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Dark-Roast-Cyber/telltale"
homepage = "https://github.com/Dark-Roast-Cyber/telltale"
exclude = [
    "AGENTS.md",
    "PLAN.md",
    "VISION.md",
    "IDEAS.md",
    "docs/internal/**",
    "docs/CHANGELOG.md",
    "docs/research-urls.md",
    "docs/siem-logging.md",
    "docs/splunk-content.md",
    "skills/**",
    ".ai/**",
    "scripts/ralph*",
    "scripts/inspiration/**",
    "tasks/**",
    ".opencode/**",
    "logs/**",
    "state/**",
    "artifacts/**",
    "runtime/ralph/**",
    "config/examples/splunk-*.conf",
    "config/examples/splunk-*.xml",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
http = "1.3"
notify = "8.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
uuid = { version = "1.11", features = ["v4"] }
walkdir = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
jsonschema = "0.29"
tempfile = "3.14"

[[bench]]
name = "benchmarks"
harness = false
